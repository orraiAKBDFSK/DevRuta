server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Los enlaces de los correos llevan un token en la dirección: nunca debe salir en la cabecera Referer.
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;

  # La API vive en el mismo origen (/api), igual que en desarrollo con proxy.conf.json.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Los assets con hash pueden cachearse mucho tiempo.
  location ~* \.(?:js|css|woff2?|ico|svg|png|jpg)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Fallback de la SPA: cualquier ruta del cliente devuelve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
