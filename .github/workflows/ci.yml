name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    name: Contenido (lecciones)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Validar lecciones y ejercicios
        run: python scripts/validate_content.py

  api:
    name: API (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Las pruebas de integración usan Testcontainers (PostgreSQL real); el runner de GitHub trae Docker.
      - name: Compilar y probar
        run: sh ./mvnw -B verify

  runner:
    name: Runner (ejecución aislada)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      # Las pruebas de aislamiento ejecutan código hostil de verdad: necesitan la imagen del sandbox.
      - name: Construir las imágenes del sandbox (Python y C++)
        run: |
          docker build -t plataforma-sandbox-python:local -f apps/runner/sandbox/Dockerfile.python apps/runner/sandbox
          docker build -t plataforma-sandbox-cpp:local -f apps/runner/sandbox/Dockerfile.cpp apps/runner/sandbox
      - name: Pruebas del runner (protocolo, servidor y aislamiento)
        working-directory: apps/runner
        run: python -m unittest discover -s tests -t . -v
      - name: Todos los ejercicios de código (Python y C++), por el runner real
        run: |
          RUNNER_TOKEN=ci-token-ci-token-0123456789 docker compose -f infra/compose/docker-compose.yml -f infra/compose/ci-runner-port.yml --profile full up -d --build runner
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8090/healthz && break; sleep 2; done
          python scripts/verify_runner_content.py --url http://127.0.0.1:8090 --token ci-token-ci-token-0123456789

  web:
    name: Web (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Pruebas
        run: npm test -- --no-watch
      - name: Compilar (producción)
        run: npm run build

  images:
    name: Imágenes Docker (solo compilan)
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v7
      - name: Construir imagen de la API
        run: docker build apps/api
      - name: Construir imagen de la web
        run: docker build apps/web
