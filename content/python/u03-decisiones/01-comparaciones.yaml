  - id: py.u03.l01.e07
    type: write_code
    difficulty: 2
    skills: [py.compare, py.input]
    prompt:
      es: |
        Lee una edad (entero) y muestra `True` si es mayor o igual a 18, o `False` si no.
      en: |
        Read an age (whole number) and show `True` if it is 18 or more, or `False` otherwise.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      edad = int(input())
      print(edad >= 18)
    tests:
      - {stdin: "20\n", expected_stdout: "True\n", visible: true}
      - {stdin: "18\n", expected_stdout: "True\n", visible: false}
      - {stdin: "17\n", expected_stdout: "False\n", visible: false}
    wrong_examples:
      - code: |
          edad = int(input())
          print(edad > 18)
        expect_fail_tag: logic.off_by_one
      - code: |
          edad = int(input())
          print(edad == 18)
        expect_fail_tag: logic.wrong_operator
    hints:
      - {es: 'Puedes pasarle una comparación directamente a print.', en: 'You can pass a comparison directly to print.'}
      - {es: '"Mayor o igual" incluye al 18.', en: '"Greater or equal" includes 18.'}
    explanation:
      es: 'Con `>` el 18 daría `False`; el límite exacto es un error muy común.'
      en: 'With `>` the value 18 would give `False`; the exact boundary is a very common mistake.'

  - id: py.u03.l01.e08
    type: predict_output
    difficulty: 2
    skills: [py.compare, py.types.basic]
    prompt:
      es: '¿Qué muestra este programa?'
      en: 'What does this program show?'
    code: |
      print(type(3 < 4))
    answer: "<class 'bool'>"
    hints:
      - {es: 'Una comparación devuelve verdadero o falso.', en: 'A comparison returns true or false.'}
    explanation:
      es: 'El resultado de comparar es un valor de tipo `bool`.'
      en: 'The result of comparing is a value of type `bool`.'
