      - {es: 'n >= 1 or n <= 10', en: 'n >= 1 or n <= 10'}
      - {es: 'n > 1 and n < 10', en: 'n > 1 and n < 10'}
      - {es: 'n >= 1 and <= 10', en: 'n >= 1 and <= 10'}
    answer: 0
    distractor_tags: {1: logic.or_vs_and, 2: logic.off_by_one, 3: syntax.incomplete_condition}
