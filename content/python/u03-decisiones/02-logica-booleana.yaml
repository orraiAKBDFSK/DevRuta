  - id: py.u03.l02.e07
    type: write_code
    difficulty: 3
    skills: [py.bool, py.compare, py.operators, py.input]
    prompt:
      es: |
        Lee un entero y muestra `True` si es **par y positivo**, o `False` en cualquier otro caso.
      en: |
        Read a whole number and show `True` if it is **even and positive**, or `False` otherwise.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      n = int(input())
      print(n % 2 == 0 and n > 0)
    tests:
      - {stdin: "4\n", expected_stdout: "True\n", visible: true}
      - {stdin: "-2\n", expected_stdout: "False\n", visible: false}
      - {stdin: "3\n", expected_stdout: "False\n", visible: false}
      - {stdin: "0\n", expected_stdout: "False\n", visible: false}
    wrong_examples:
      - code: |
          n = int(input())
          print(n % 2 == 0)
        expect_fail_tag: logic.missing_condition
      - code: |
          n = int(input())
          print(n % 2 == 0 or n > 0)
        expect_fail_tag: logic.or_vs_and
    hints:
      - {es: 'Un número es par si el resto de dividirlo entre 2 es 0.', en: 'A number is even if the remainder of dividing it by 2 is 0.'}
      - {es: 'Necesitas dos comparaciones unidas con `and`.', en: 'You need two comparisons joined with `and`.'}
    explanation:
      es: 'Con `or` bastaría con ser positivo (o par), y con una sola condición faltaría la otra.'
      en: 'With `or` being positive (or even) would be enough, and with a single condition the other would be missing.'

