title:
  es: 'Combinar condiciones'
  en: 'Combining conditions'
explanation:
  es: |
    Puedes combinar valores `bool` con tres operadores:

    | Operador | Significa | Es `True` cuando... |
    |---|---|---|
    | `and` | y | **ambos** lados son `True` |
    | `or` | o | **al menos uno** es `True` |
    | `not` | no | invierte el valor |

    ```python
    edad = 25
    print(edad >= 18 and edad < 65)   # True
    print(not (edad >= 18))           # False
    ```

    Usa paréntesis cuando tengas dudas sobre el orden: `not` va primero, luego `and`, luego `or`.
  en: |
    You can combine `bool` values with three operators:

    | Operator | Means | Is `True` when... |
    |---|---|---|
    | `and` | and | **both** sides are `True` |
    | `or` | or | **at least one** is `True` |
    | `not` | not | it flips the value |

    ```python
    edad = 25
    print(edad >= 18 and edad < 65)   # True
    print(not (edad >= 18))           # False
    ```

    Use parentheses when in doubt about the order: `not` goes first, then `and`, then `or`.
exercises:
  - id: py.u03.l02.e01
    type: predict_output
    difficulty: 1
    skills: [py.bool]
    prompt:
      es: '¿Qué muestra este programa?'
      en: 'What does this program show?'
    code: |
      print(True and False)
    answer: "False"
    hints:
      - {es: '`and` necesita que los dos lados sean verdaderos.', en: '`and` needs both sides to be true.'}
    explanation:
      es: 'Uno de los lados es `False`, así que `and` da `False`.'
      en: 'One side is `False`, so `and` gives `False`.'

