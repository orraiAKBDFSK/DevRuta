title:
  es: 'Tuplas'
  en: 'Tuples'
explanation:
  es: |
    Una **tupla** es como una lista, pero **no se puede modificar**. Se escribe con paréntesis:

    ```python
    punto = (3, 4)
    print(punto[0])      # 3
    print(len(punto))    # 2
    punto[0] = 9         # TypeError: no se puede modificar
    ```

    Se usan para agrupar valores que van juntos (como unas coordenadas). Dos usos muy comunes:

    - **Desempaquetar**: `x, y = punto` guarda cada valor en su propia variable.
    - **Devolver varios valores** desde una función: `return a, b` devuelve una tupla.

    También sirve para intercambiar dos variables sin una temporal: `a, b = b, a`.
  en: |
    A **tuple** is like a list, but it **cannot be modified**. It is written with parentheses:

    ```python
    punto = (3, 4)
    print(punto[0])      # 3
    print(len(punto))    # 2
    punto[0] = 9         # TypeError: it cannot be modified
    ```

    They are used to group values that belong together (such as coordinates). Two very common uses:

    - **Unpacking**: `x, y = punto` stores each value in its own variable.
    - **Returning several values** from a function: `return a, b` returns a tuple.

    It also lets you swap two variables without a temporary one: `a, b = b, a`.
exercises:
  - id: py.u07.l01.e01
    type: predict_output
    difficulty: 1
    skills: [py.tuple]
    prompt:
      es: '¿Qué muestra este programa?'
      en: 'What does this program show?'
    code: |
      t = (10, 20, 30)
      print(t[1])
    answer: "20"
    hints:
      - {es: 'Las tuplas se indexan igual que las listas.', en: 'Tuples are indexed just like lists.'}
    explanation:
      es: 'El índice 1 es el segundo elemento.'
      en: 'Index 1 is the second element.'

