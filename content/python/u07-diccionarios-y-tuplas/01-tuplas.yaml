  - id: py.u07.l01.e03
    type: multiple_choice
    difficulty: 2
    skills: [py.tuple]
    prompt:
      es: |
        ¿Qué ocurre al ejecutar este programa?

        ```python
        t = (1, 2, 3)
        t[0] = 5
        ```
      en: |
        What happens when running this program?

        ```python
        t = (1, 2, 3)
        t[0] = 5
        ```
    options:
      - {es: 'Da un `TypeError`: las tuplas no se pueden modificar.', en: 'It raises a `TypeError`: tuples cannot be modified.'}
      - {es: 'La tupla pasa a ser `(5, 2, 3)`.', en: 'The tuple becomes `(5, 2, 3)`.'}
      - {es: 'Se agrega un 5 al final.', en: 'A 5 is added at the end.'}
      - {es: 'No ocurre nada.', en: 'Nothing happens.'}
    answer: 0
    distractor_tags: {1: tuple.mutability_misconception}
    hints:
      - {es: 'Esa es la diferencia principal entre una tupla y una lista.', en: 'That is the main difference between a tuple and a list.'}
    explanation:
      es: 'Si necesitas cambiar elementos, usa una lista.'
      en: 'If you need to change elements, use a list.'

