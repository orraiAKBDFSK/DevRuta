  - id: py.u07.l01.e07
    type: fill_code
    difficulty: 2
    skills: [py.tuple, py.return]
    prompt:
      es: 'Completa la función para que devuelva el menor y el mayor, y el programa muestre `1 3`.'
      en: 'Fill in the function so it returns the smallest and the largest, and the program shows `1 3`.'
    code: |
      def extremos(lista):
          return min(lista), ___(lista)

      a, b = extremos([3, 1, 2])
      print(a, b)
    blanks:
      - [max]
    hints:
      - {es: 'Falta la función que devuelve el mayor.', en: 'The function that returns the largest is missing.'}
    explanation:
      es: 'La función devuelve `(1, 3)` y se desempaqueta en `a` y `b`.'
      en: 'The function returns `(1, 3)` and it is unpacked into `a` and `b`.'

  - id: py.u07.l01.e08
    type: write_code
    difficulty: 3
    skills: [py.tuple, py.def, py.return, py.list, py.input]
    prompt:
      es: |
        Define `min_max(lista)` que **devuelva** una tupla con el menor y el mayor. Lee un entero `n` (1 o mayor) y luego
        `n` enteros (uno por línea); desempaqueta el resultado y muestra el menor y el mayor separados por un espacio.
      en: |
        Define `min_max(lista)` that **returns** a tuple with the smallest and the largest. Read a whole number `n` (1 or greater) and then
        `n` whole numbers (one per line); unpack the result and show the smallest and the largest separated by a space.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      def min_max(lista):
          return min(lista), max(lista)

      n = int(input())
      datos = []
      for i in range(n):
          datos.append(int(input()))
      menor, mayor = min_max(datos)
      print(menor, mayor)
    tests:
      - {stdin: "3\n4\n9\n2\n", expected_stdout: "2 9\n", visible: true}
      - {stdin: "1\n5\n", expected_stdout: "5 5\n", visible: false}
      - {stdin: "4\n-3\n0\n8\n-7\n", expected_stdout: "-7 8\n", visible: false}
    static_checks:
      - {kind: requires_function, name: min_max, returns: true}
    wrong_examples:
      - code: |
          def min_max(lista):
              return max(lista), min(lista)

          n = int(input())
          datos = []
          for i in range(n):
              datos.append(int(input()))
          menor, mayor = min_max(datos)
          print(menor, mayor)
        expect_fail_tag: logic.swapped_order
    hints:
      - {es: 'Devuelve los dos valores separados por coma: `return a, b`.', en: 'Return the two values separated by a comma: `return a, b`.'}
    explanation:
      es: 'El orden del `return` es el orden en que se desempaqueta.'
      en: 'The order in the `return` is the order in which it is unpacked.'

  - id: py.u07.l01.e09
    type: write_code
    difficulty: 2
    skills: [py.tuple, py.input]
    prompt:
      es: |
        Lee dos enteros `a` y `b` (uno por línea) e intercámbialos con desempaquetado de tuplas
        (`a, b = b, a`). Muestra el nuevo `a` y el nuevo `b` separados por un espacio.
      en: |
        Read two whole numbers `a` and `b` (one per line) and swap them using tuple unpacking
        (`a, b = b, a`). Show the new `a` and the new `b` separated by a space.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      a = int(input())
      b = int(input())
      a, b = b, a
      print(a, b)
    tests:
      - {stdin: "1\n2\n", expected_stdout: "2 1\n", visible: true}
      - {stdin: "10\n-5\n", expected_stdout: "-5 10\n", visible: false}
    wrong_examples:
      - code: |
          a = int(input())
          b = int(input())
          a = b
          b = a
          print(a, b)
        expect_fail_tag: logic.swap_without_temp
    hints:
      - {es: 'Con tuplas no necesitas una variable temporal.', en: 'With tuples you do not need a temporary variable.'}
    explanation:
      es: 'Con `a = b` y luego `b = a`, ambas terminarían con el valor original de `b`.'
      en: 'With `a = b` and then `b = a`, both would end up with the original value of `b`.'

  - id: py.u07.l01.e10
    type: write_code
    difficulty: 3
    skills: [py.tuple, py.def, py.return, py.operators, py.input]
    prompt:
      es: |
        Define `cociente_resto(a, b)` que **devuelva** el cociente entero y el resto de dividir `a` entre `b`.
        Lee `a` y `b` (enteros, uno por línea), desempaqueta y muestra el cociente y el resto separados por un espacio.
      en: |
        Define `cociente_resto(a, b)` that **returns** the whole quotient and the remainder of dividing `a` by `b`.
        Read `a` and `b` (whole numbers, one per line), unpack and show the quotient and the remainder separated by a space.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      def cociente_resto(a, b):
          return a // b, a % b

      x = int(input())
      y = int(input())
      q, r = cociente_resto(x, y)
      print(q, r)
    tests:
      - {stdin: "17\n5\n", expected_stdout: "3 2\n", visible: true}
      - {stdin: "10\n2\n", expected_stdout: "5 0\n", visible: false}
      - {stdin: "3\n7\n", expected_stdout: "0 3\n", visible: false}
    static_checks:
      - {kind: requires_function, name: cociente_resto, returns: true}
    wrong_examples:
      - code: |
          def cociente_resto(a, b):
              return a / b, a % b

          x = int(input())
          y = int(input())
          q, r = cociente_resto(x, y)
          print(q, r)
        expect_fail_tag: op.floordiv_vs_div
    hints:
      - {es: 'Usa `//` para el cociente y `%` para el resto.', en: 'Use `//` for the quotient and `%` for the remainder.'}
    explanation:
      es: 'Una tupla permite devolver dos resultados con un solo `return`.'
      en: 'A tuple lets you return two results with a single `return`.'
