title:
  es: 'Repaso y mini-programas'
  en: 'Review and mini programs'
explanation:
  es: |
    Repaso de tuplas, diccionarios y conjuntos. Una guía rápida para elegir:

    - **Lista**: secuencia ordenada que cambia.
    - **Tupla**: secuencia ordenada que no cambia (agrupar valores).
    - **Diccionario**: buscar un valor por su clave.
    - **Conjunto**: guardar elementos únicos y comprobar pertenencia.
  en: |
    Review of tuples, dictionaries and sets. A quick guide to choose:

    - **List**: ordered sequence that changes.
    - **Tuple**: ordered sequence that does not change (group values).
    - **Dictionary**: look up a value by its key.
    - **Set**: store unique elements and check membership.
exercises:
  - id: py.u07.l05.e01
    type: predict_output
    difficulty: 2
    skills: [py.tuple]
    prompt:
      es: '¿Qué muestra este programa?'
      en: 'What does this program show?'
    code: |
      t = (1, 2)
      a, b = t
      print(a + b)
    answer: "3"
    hints:
      - {es: 'Desempaqueta primero.', en: 'Unpack first.'}
    explanation:
      es: 'Repasa "Tuplas". `a` vale 1 y `b` vale 2.'
      en: 'Review "Tuples". `a` is 1 and `b` is 2.'

  - id: py.u07.l05.e02
    type: predict_output
    difficulty: 2
    skills: [py.dict]
    prompt:
      es: '¿Qué muestra este programa?'
      en: 'What does this program show?'
    code: |
      d = {"x": 1}
      d["y"] = d["x"] + 1
      print(d)
    answer: "{'x': 1, 'y': 2}"
    hints:
      - {es: 'Primero se calcula el lado derecho.', en: 'The right side is calculated first.'}
    explanation:
      es: 'Repasa "Diccionarios". Se lee `d["x"]` y se guarda el resultado en una clave nueva.'
      en: 'Review "Dictionaries". `d["x"]` is read and the result is stored under a new key.'

  - id: py.u07.l05.e03
    type: multiple_choice
    difficulty: 2
    skills: [py.dict, py.list, py.set, py.tuple]
    prompt:
      es: 'Quieres guardar cuántas veces aparece cada palabra de un texto. ¿Qué estructura encaja mejor?'
      en: 'You want to store how many times each word of a text appears. Which structure fits best?'
    options:
      - {es: 'Un diccionario: palabra → cantidad.', en: 'A dictionary: word → count.'}
      - {es: 'Una tupla.', en: 'A tuple.'}
      - {es: 'Un conjunto.', en: 'A set.'}
      - {es: 'Una lista de números.', en: 'A list of numbers.'}
    answer: 0
    distractor_tags: {2: structure.set_loses_counts, 3: structure.list_no_key}
    hints:
      - {es: 'Necesitas asociar cada palabra con un número.', en: 'You need to associate each word with a number.'}
    explanation:
      es: 'Un conjunto descartaría los repetidos y perdería las cantidades.'
      en: 'A set would discard repeats and lose the counts.'

  - id: py.u07.l05.e04
    type: order_lines
    difficulty: 3
    skills: [py.dict, py.for]
    prompt:
      es: 'Ordena las líneas para que el programa cuente las letras de `casa` y muestre el diccionario.'
      en: 'Order the lines so the program counts the letters of `casa` and shows the dictionary.'
    lines:
      - 'conteo = {}'
      - 'for letra in "casa":'
      - '    conteo[letra] = conteo.get(letra, 0) + 1'
      - 'print(conteo)'
    hints:
      - {es: 'El diccionario vacío se crea antes del bucle.', en: 'The empty dictionary is created before the loop.'}
    explanation:
      es: 'Resultado: `{''c'': 1, ''a'': 2, ''s'': 1}`.'
      en: 'Result: `{''c'': 1, ''a'': 2, ''s'': 1}`.'

  - id: py.u07.l05.e05
    type: write_code
    difficulty: 3
    skills: [py.dict, py.for, py.input]
    prompt:
      es: 'Lee una palabra y muestra un diccionario con cuántas veces aparece cada letra.'
      en: 'Read a word and show a dictionary with how many times each letter appears.'
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      palabra = input()
      conteo = {}
      for letra in palabra:
          conteo[letra] = conteo.get(letra, 0) + 1
      print(conteo)
    tests:
      - {stdin: "casa\n", expected_stdout: "{'c': 1, 'a': 2, 's': 1}\n", visible: true}
      - {stdin: "hola\n", expected_stdout: "{'h': 1, 'o': 1, 'l': 1, 'a': 1}\n", visible: false}
      - {stdin: "aab\n", expected_stdout: "{'a': 2, 'b': 1}\n", visible: false}
    wrong_examples:
      - code: |
          palabra = input()
          conteo = {}
          for letra in palabra:
              conteo[letra] = 1
          print(conteo)
        expect_fail_tag: logic.missing_increment
    hints:
      - {es: 'Es el mismo patrón de conteo, pero recorriendo un texto.', en: 'It is the same counting pattern, but walking through text.'}
    explanation:
      es: 'Recorrer un texto da una letra por vuelta.'
      en: 'Walking through text gives one letter per turn.'

  - id: py.u07.l05.e06
    type: write_code
    difficulty: 4
    skills: [py.dict, py.list, py.input]
    prompt:
      es: |
        Lee dos palabras (una por línea). Muestra `True` si son anagramas (tienen exactamente las mismas letras
        con las mismas repeticiones, en cualquier orden) y `False` si no.
      en: |
        Read two words (one per line). Show `True` if they are anagrams (they have exactly the same letters
        with the same repetitions, in any order) and `False` otherwise.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      def contar(texto):
          conteo = {}
          for letra in texto:
              conteo[letra] = conteo.get(letra, 0) + 1
          return conteo

      a = input()
      b = input()
      print(contar(a) == contar(b))
    tests:
      - {stdin: "amor\nroma\n", expected_stdout: "True\n", visible: true}
      - {stdin: "casa\ncosa\n", expected_stdout: "False\n", visible: false}
      - {stdin: "a\nab\n", expected_stdout: "False\n", visible: false}
      - {stdin: "aab\nabb\n", expected_stdout: "False\n", visible: false}
    wrong_examples:
      - code: |
          a = input()
          b = input()
          print(set(a) == set(b))
        expect_fail_tag: set.loses_counts
    hints:
      - {es: 'Dos diccionarios se pueden comparar con `==`.', en: 'Two dictionaries can be compared with `==`.'}
      - {es: 'Un conjunto no sirve aquí: pierde cuántas veces aparece cada letra.', en: 'A set does not work here: it loses how many times each letter appears.'}
    explanation:
      es: '`aab` y `abb` tienen las mismas letras distintas, pero no las mismas cantidades.'
      en: '`aab` and `abb` have the same distinct letters, but not the same counts.'

  - id: py.u07.l05.e07
    type: write_code
    difficulty: 4
    skills: [py.dict, py.list, py.list.methods, py.for, py.input]
    prompt:
      es: |
        Lee un entero `n` y luego `n` palabras en minúsculas (una por línea). Agrúpalas por su primera letra
        en un diccionario cuyos valores son listas, conservando el orden de aparición. Muestra el diccionario.
      en: |
        Read a whole number `n` and then `n` lowercase words (one per line). Group them by their first letter
        in a dictionary whose values are lists, keeping the order of appearance. Show the dictionary.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      n = int(input())
      grupos = {}
      for i in range(n):
          palabra = input()
          inicial = palabra[0]
          if inicial not in grupos:
              grupos[inicial] = []
          grupos[inicial].append(palabra)
      print(grupos)
    tests:
      - {stdin: "4\nana\nbea\nalba\nbeto\n", expected_stdout: "{'a': ['ana', 'alba'], 'b': ['bea', 'beto']}\n", visible: true}
      - {stdin: "1\nzoe\n", expected_stdout: "{'z': ['zoe']}\n", visible: false}
      - {stdin: "3\nmar\nleo\nmia\n", expected_stdout: "{'m': ['mar', 'mia'], 'l': ['leo']}\n", visible: false}
    wrong_examples:
      - code: |
          n = int(input())
          grupos = {}
          for i in range(n):
              palabra = input()
              grupos[palabra[0]] = [palabra]
          print(grupos)
        expect_fail_tag: logic.overwrites_previous
    hints:
      - {es: 'El texto también se puede indexar: `palabra[0]` es su primera letra.', en: 'Text can also be indexed: `palabra[0]` is its first letter.'}
      - {es: 'Si la inicial es nueva, crea una lista vacía antes de agregar.', en: 'If the initial is new, create an empty list before adding.'}
    explanation:
      es: 'Asignar `[palabra]` cada vez borraría las palabras anteriores del grupo.'
      en: 'Assigning `[palabra]` each time would erase the earlier words of the group.'

  - id: py.u07.l05.e08
    type: write_code
    difficulty: 4
    skills: [py.tuple, py.def, py.return, py.list, py.input]
    prompt:
      es: |
        Define `estadisticas(lista)` que **devuelva** una tupla `(menor, mayor, promedio)`. Lee un entero `n` (1 o mayor)
        y luego `n` enteros (uno por línea); desempaqueta el resultado y muestra los tres valores separados por espacios.
      en: |
        Define `estadisticas(lista)` that **returns** a tuple `(smallest, largest, average)`. Read a whole number `n` (1 or greater)
        and then `n` whole numbers (one per line); unpack the result and show the three values separated by spaces.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      def estadisticas(lista):
          return min(lista), max(lista), sum(lista) / len(lista)

      n = int(input())
      datos = []
      for i in range(n):
          datos.append(int(input()))
      menor, mayor, prom = estadisticas(datos)
      print(menor, mayor, prom)
    tests:
      - {stdin: "3\n1\n2\n3\n", expected_stdout: "1 3 2.0\n", visible: true}
      - {stdin: "2\n10\n0\n", expected_stdout: "0 10 5.0\n", visible: false}
      - {stdin: "1\n7\n", expected_stdout: "7 7 7.0\n", visible: false}
    static_checks:
      - {kind: requires_function, name: estadisticas, returns: true}
    wrong_examples:
      - code: |
          def estadisticas(lista):
              return min(lista), max(lista), sum(lista) // len(lista)

          n = int(input())
          datos = []
          for i in range(n):
              datos.append(int(input()))
          menor, mayor, prom = estadisticas(datos)
          print(menor, mayor, prom)
        expect_fail_tag: op.floordiv_vs_div
    hints:
      - {es: 'Devuelve los tres valores separados por comas en un solo `return`.', en: 'Return the three values separated by commas in a single `return`.'}
    explanation:
      es: 'Una tupla agrupa varios resultados que van juntos.'
      en: 'A tuple groups several results that belong together.'
