title:
  es: 'Diccionarios'
  en: 'Dictionaries'
explanation:
  es: |
    Un **diccionario** guarda pares **clave: valor**. En vez de buscar por posición, buscas por clave:

    ```python
    edades = {"Ana": 20, "Luis": 25}
    print(edades["Ana"])        # 20
    edades["Eva"] = 30          # agrega un par nuevo
    edades["Ana"] = 21          # cambia un valor existente
    del edades["Luis"]          # borra un par
    print(edades)               # {'Ana': 21, 'Eva': 30}
    ```

    - Las claves son **únicas** y suelen ser texto o números.
    - `clave in diccionario` pregunta si la **clave** existe (no el valor).
    - Pedir una clave que no existe con `[]` da un `KeyError`. Con `.get(clave, valor_por_defecto)` no falla.
    - `len(diccionario)` cuenta los pares.
  en: |
    A **dictionary** stores **key: value** pairs. Instead of looking up by position, you look up by key:

    ```python
    edades = {"Ana": 20, "Luis": 25}
    print(edades["Ana"])        # 20
    edades["Eva"] = 30          # adds a new pair
    edades["Ana"] = 21          # changes an existing value
    del edades["Luis"]          # deletes a pair
    print(edades)               # {'Ana': 21, 'Eva': 30}
    ```

    - Keys are **unique** and are usually text or numbers.
    - `key in dictionary` asks whether the **key** exists (not the value).
    - Asking for a key that does not exist with `[]` raises a `KeyError`. With `.get(key, default_value)` it does not fail.
    - `len(dictionary)` counts the pairs.
