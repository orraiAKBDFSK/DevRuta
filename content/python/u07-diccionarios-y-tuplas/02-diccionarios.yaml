  - id: py.u07.l02.e08
    type: write_code
    difficulty: 3
    skills: [py.dict, py.input, py.for]
    prompt:
      es: |
        Lee un entero `n` y luego `n` pares de líneas: un nombre y su edad (entero). Después lee un nombre a buscar.
        Muestra su edad, o `no existe` si el nombre no está.
      en: |
        Read a whole number `n` and then `n` pairs of lines: a name and its age (whole number). Then read a name to look up.
        Show its age, or `no existe` if the name is not there.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      n = int(input())
      edades = {}
      for i in range(n):
          nombre = input()
          edad = int(input())
          edades[nombre] = edad
      buscado = input()
      if buscado in edades:
          print(edades[buscado])
      else:
          print("no existe")
    tests:
      - {stdin: "2\nAna\n20\nLuis\n25\nLuis\n", expected_stdout: "25\n", visible: true}
      - {stdin: "1\nAna\n20\nEva\n", expected_stdout: "no existe\n", visible: false}
      - {stdin: "3\na\n1\nb\n2\nc\n3\nb\n", expected_stdout: "2\n", visible: false}
    wrong_examples:
      - code: |
          n = int(input())
          edades = {}
          for i in range(n):
              nombre = input()
              edad = int(input())
              edades[nombre] = edad
          buscado = input()
          print(edades[buscado])
        expect_fail_tag: dict.keyerror_unhandled
    hints:
      - {es: 'Comprueba con `in` antes de acceder a la clave.', en: 'Check with `in` before accessing the key.'}
    explanation:
      es: 'Acceder con `[]` a una clave inexistente interrumpe el programa con un `KeyError`.'
      en: 'Accessing a missing key with `[]` interrupts the program with a `KeyError`.'

  - id: py.u07.l02.e09
    type: write_code
    difficulty: 2
    skills: [py.dict, py.input]
    prompt:
      es: |
        Parte del diccionario `{"a": 1, "b": 2}`. Lee una clave (texto) y un valor (entero), uno por línea.
        Asigna ese valor a esa clave (cambiándolo o agregándolo) y muestra el diccionario.
      en: |
        Start with the dictionary `{"a": 1, "b": 2}`. Read a key (text) and a value (whole number), one per line.
        Assign that value to that key (changing or adding it) and show the dictionary.
    starter: |
      d = {"a": 1, "b": 2}
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      d = {"a": 1, "b": 2}
      clave = input()
      valor = int(input())
      d[clave] = valor
      print(d)
    tests:
      - {stdin: "b\n9\n", expected_stdout: "{'a': 1, 'b': 9}\n", visible: true}
      - {stdin: "c\n3\n", expected_stdout: "{'a': 1, 'b': 2, 'c': 3}\n", visible: false}
    wrong_examples:
      - code: |
          d = {"a": 1, "b": 2}
          clave = input()
          valor = int(input())
          print(d)
        expect_fail_tag: logic.missing_branch
      - code: |
          d = {"a": 1, "b": 2}
          clave = input()
          valor = input()
          d[clave] = valor
          print(d)
        expect_fail_tag: io.input_not_cast
    hints:
      - {es: 'La misma asignación sirve para agregar y para cambiar.', en: 'The same assignment works for adding and for changing.'}
    explanation:
      es: 'Sin `int()`, el valor se guardaría como texto y se mostraría con comillas.'
      en: 'Without `int()`, the value would be stored as text and shown with quotes.'

  - id: py.u07.l02.e10
    type: write_code
    difficulty: 3
    skills: [py.dict, py.if, py.input]
    prompt:
      es: |
        Parte del diccionario `{"a": 1, "b": 2, "c": 3}`. Lee una clave. Si existe, bórrala; si no, no hagas nada.
        Muestra el diccionario resultante.
      en: |
        Start with the dictionary `{"a": 1, "b": 2, "c": 3}`. Read a key. If it exists, delete it; if not, do nothing.
        Show the resulting dictionary.
    starter: |
      d = {"a": 1, "b": 2, "c": 3}
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      d = {"a": 1, "b": 2, "c": 3}
      clave = input()
      if clave in d:
          del d[clave]
      print(d)
    tests:
      - {stdin: "b\n", expected_stdout: "{'a': 1, 'c': 3}\n", visible: true}
      - {stdin: "z\n", expected_stdout: "{'a': 1, 'b': 2, 'c': 3}\n", visible: false}
      - {stdin: "a\n", expected_stdout: "{'b': 2, 'c': 3}\n", visible: false}
    wrong_examples:
      - code: |
          d = {"a": 1, "b": 2, "c": 3}
          clave = input()
          del d[clave]
          print(d)
        expect_fail_tag: dict.keyerror_unhandled
    hints:
      - {es: '`del d[clave]` borra el par.', en: '`del d[clave]` deletes the pair.'}
    explanation:
      es: 'Borrar una clave inexistente da `KeyError`, por eso se comprueba antes con `in`.'
      en: 'Deleting a missing key raises `KeyError`, which is why it is checked first with `in`.'
