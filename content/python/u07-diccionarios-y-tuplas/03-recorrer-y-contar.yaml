title:
  es: 'Recorrer diccionarios y contar'
  en: 'Walking through dictionaries and counting'
explanation:
  es: |
    Hay tres formas de recorrer un diccionario:

    ```python
    notas = {"Ana": 8, "Luis": 6}
    for nombre in notas:               # solo las claves
        print(nombre)
    for valor in notas.values():       # solo los valores
        print(valor)
    for nombre, nota in notas.items(): # clave y valor a la vez
        print(nombre, nota)
    ```

    Un uso muy frecuente es **contar cuántas veces aparece cada elemento**:

    ```python
    conteo = {}
    for x in ["a", "b", "a"]:
        conteo[x] = conteo.get(x, 0) + 1
    print(conteo)    # {'a': 2, 'b': 1}
    ```

    `conteo.get(x, 0)` devuelve 0 la primera vez que aparece `x`, así que no hace falta comprobar si existe.
  en: |
    There are three ways to walk through a dictionary:

    ```python
    notas = {"Ana": 8, "Luis": 6}
    for nombre in notas:               # keys only
        print(nombre)
    for valor in notas.values():       # values only
        print(valor)
    for nombre, nota in notas.items(): # key and value at once
        print(nombre, nota)
    ```

    A very common use is **counting how many times each element appears**:

    ```python
    conteo = {}
    for x in ["a", "b", "a"]:
        conteo[x] = conteo.get(x, 0) + 1
    print(conteo)    # {'a': 2, 'b': 1}
    ```

    `conteo.get(x, 0)` returns 0 the first time `x` appears, so there is no need to check whether it exists.
