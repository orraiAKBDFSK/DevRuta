  - id: py.u07.l03.e07
    type: write_code
    difficulty: 3
    skills: [py.dict, py.for, py.input]
    prompt:
      es: 'Lee un entero `n` y luego `n` palabras (una por línea). Muestra un diccionario con cuántas veces aparece cada palabra.'
      en: 'Read a whole number `n` and then `n` words (one per line). Show a dictionary with how many times each word appears.'
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      n = int(input())
      conteo = {}
      for i in range(n):
          palabra = input()
          conteo[palabra] = conteo.get(palabra, 0) + 1
      print(conteo)
    tests:
      - {stdin: "4\na\nb\na\nc\n", expected_stdout: "{'a': 2, 'b': 1, 'c': 1}\n", visible: true}
      - {stdin: "0\n", expected_stdout: "{}\n", visible: false}
      - {stdin: "3\nx\nx\nx\n", expected_stdout: "{'x': 3}\n", visible: false}
    wrong_examples:
      - code: |
          n = int(input())
          conteo = {}
          for i in range(n):
              palabra = input()
              conteo[palabra] = conteo[palabra] + 1
          print(conteo)
        expect_fail_tag: dict.keyerror_unhandled
      - code: |
          n = int(input())
          palabras = []
          for i in range(n):
              palabras.append(input())
          print(palabras)
        expect_fail_tag: logic.wrong_structure
    hints:
      - {es: 'Usa `get(palabra, 0) + 1`.', en: 'Use `get(palabra, 0) + 1`.'}
    explanation:
      es: 'El patrón de conteo funciona incluso cuando la palabra aparece por primera vez.'
      en: 'The counting pattern works even when the word appears for the first time.'

  - id: py.u07.l03.e08
    type: write_code
    difficulty: 3
    skills: [py.dict, py.for, py.input]
    prompt:
      es: |
        Lee un entero `n` y luego `n` pares de líneas: un producto (texto) y su precio (entero).
        Muestra el total de todos los precios.
      en: |
        Read a whole number `n` and then `n` pairs of lines: a product (text) and its price (whole number).
        Show the total of all the prices.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      n = int(input())
      precios = {}
      for i in range(n):
          producto = input()
          precios[producto] = int(input())
      print(sum(precios.values()))
    tests:
      - {stdin: "2\npan\n3\nleche\n5\n", expected_stdout: "8\n", visible: true}
      - {stdin: "1\nx\n7\n", expected_stdout: "7\n", visible: false}
      - {stdin: "3\na\n1\nb\n2\nc\n4\n", expected_stdout: "7\n", visible: false}
    wrong_examples:
      - code: |
          n = int(input())
          precios = {}
          for i in range(n):
              producto = input()
              precios[producto] = int(input())
          print(len(precios))
        expect_fail_tag: logic.wrong_operation
    hints:
      - {es: '`sum(d.values())` suma todos los valores.', en: '`sum(d.values())` adds up all the values.'}
    explanation:
      es: 'Se guardan los pares y luego se suman los valores.'
      en: 'The pairs are stored and then the values are added up.'

  - id: py.u07.l03.e09
    type: write_code
    difficulty: 4
    skills: [py.dict, py.for, py.if, py.input]
    prompt:
      es: |
        Lee un entero `n` (1 o mayor) y luego `n` palabras (una por línea). Muestra la palabra que más veces aparece.
        Si hay empate, muestra la que apareció primero.
      en: |
        Read a whole number `n` (1 or greater) and then `n` words (one per line). Show the word that appears the most.
        If there is a tie, show the one that appeared first.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      n = int(input())
      conteo = {}
      for i in range(n):
          palabra = input()
          conteo[palabra] = conteo.get(palabra, 0) + 1
      mejor = None
      mejor_cuenta = 0
      for palabra, cuenta in conteo.items():
          if cuenta > mejor_cuenta:
              mejor = palabra
              mejor_cuenta = cuenta
      print(mejor)
    tests:
      - {stdin: "5\na\nb\na\nc\nb\n", expected_stdout: "a\n", visible: true}
      - {stdin: "3\nx\ny\ny\n", expected_stdout: "y\n", visible: false}
      - {stdin: "1\nz\n", expected_stdout: "z\n", visible: false}
    wrong_examples:
      - code: |
          n = int(input())
          conteo = {}
          for i in range(n):
              palabra = input()
              conteo[palabra] = conteo.get(palabra, 0) + 1
          mejor = None
          mejor_cuenta = 0
          for palabra, cuenta in conteo.items():
              if cuenta >= mejor_cuenta:
                  mejor = palabra
                  mejor_cuenta = cuenta
          print(mejor)
        expect_fail_tag: logic.tie_handling
    hints:
      - {es: 'Cuenta primero con un diccionario; después busca el mayor recorriéndolo con `items()`.', en: 'Count first with a dictionary; then find the largest by walking through it with `items()`.'}
      - {es: 'Para quedarte con el primero en un empate, actualiza solo si es estrictamente mayor.', en: 'To keep the first one in a tie, update only if it is strictly greater.'}
    explanation:
      es: 'Con `>=` un empate reemplazaría a la palabra anterior por la última.'
      en: 'With `>=` a tie would replace the earlier word with the last one.'
