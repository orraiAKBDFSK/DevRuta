title:
  es: 'Conjuntos'
  en: 'Sets'
explanation:
  es: |
    Un **conjunto** (`set`) guarda elementos **sin repetir** y **sin orden**:

    ```python
    s = {1, 2, 2, 3}
    print(len(s))            # 3  (el 2 solo cuenta una vez)
    s.add(4)                 # agrega un elemento
    print(3 in s)            # True
    unicos = set([1, 1, 2])  # quita repetidos de una lista
    ```

    - Un conjunto vacío se crea con `set()`; `{}` crea un diccionario vacío.
    - Como **no tienen orden**, no se puede usar índice, y el orden en que se muestran no es fiable.
      Para mostrarlos de forma estable usa `sorted(conjunto)`, que devuelve una lista ordenada.
    - Operaciones entre conjuntos: `a | b` (unión), `a & b` (intersección: lo que tienen en común) y `a - b` (lo que está en `a` y no en `b`).
  en: |
    A **set** (`set`) stores elements **without repeats** and **without order**:

    ```python
    s = {1, 2, 2, 3}
    print(len(s))            # 3  (the 2 only counts once)
    s.add(4)                 # adds an element
    print(3 in s)            # True
    unicos = set([1, 1, 2])  # removes repeats from a list
    ```

    - An empty set is created with `set()`; `{}` creates an empty dictionary.
    - Since they have **no order**, you cannot use an index, and the order in which they are shown is not reliable.
      To show them in a stable way use `sorted(set)`, which returns a sorted list.
    - Operations between sets: `a | b` (union), `a & b` (intersection: what they have in common) and `a - b` (what is in `a` and not in `b`).
