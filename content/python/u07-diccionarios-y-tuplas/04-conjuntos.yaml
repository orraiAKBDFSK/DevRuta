  - id: py.u07.l04.e07
    type: write_code
    difficulty: 3
    skills: [py.set, py.list, py.input]
    prompt:
      es: 'Lee un entero `n` y luego `n` enteros (uno por línea). Muestra cuántos valores **distintos** hay.'
      en: 'Read a whole number `n` and then `n` whole numbers (one per line). Show how many **distinct** values there are.'
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      n = int(input())
      vistos = set()
      for i in range(n):
          vistos.add(int(input()))
      print(len(vistos))
    tests:
      - {stdin: "5\n1\n2\n1\n3\n2\n", expected_stdout: "3\n", visible: true}
      - {stdin: "0\n", expected_stdout: "0\n", visible: false}
      - {stdin: "3\n4\n4\n4\n", expected_stdout: "1\n", visible: false}
    wrong_examples:
      - code: |
          n = int(input())
          vistos = []
          for i in range(n):
              vistos.append(int(input()))
          print(len(vistos))
        expect_fail_tag: logic.missing_dedup
    hints:
      - {es: 'Empieza con `set()` y usa `add`.', en: 'Start with `set()` and use `add`.'}
    explanation:
      es: 'Un conjunto descarta los repetidos automáticamente.'
      en: 'A set discards repeats automatically.'

  - id: py.u07.l04.e08
    type: write_code
    difficulty: 4
    skills: [py.set, py.list, py.input]
    prompt:
      es: |
        Lee un entero `n`, luego `n` enteros (lista A); después un entero `m` y `m` enteros (lista B), uno por línea.
        Muestra la lista ordenada de los valores que están en **ambas** listas, sin repetidos.
      en: |
        Read a whole number `n`, then `n` whole numbers (list A); then a whole number `m` and `m` whole numbers (list B), one per line.
        Show the sorted list of the values that are in **both** lists, without repeats.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      n = int(input())
      a = set()
      for i in range(n):
          a.add(int(input()))
      m = int(input())
      b = set()
      for i in range(m):
          b.add(int(input()))
      print(sorted(a & b))
    tests:
      - {stdin: "3\n1\n2\n3\n3\n2\n3\n4\n", expected_stdout: "[2, 3]\n", visible: true}
      - {stdin: "2\n1\n2\n2\n3\n4\n", expected_stdout: "[]\n", visible: false}
      - {stdin: "4\n5\n5\n1\n2\n3\n5\n2\n2\n", expected_stdout: "[2, 5]\n", visible: false}
    wrong_examples:
      - code: |
          n = int(input())
          a = set()
          for i in range(n):
              a.add(int(input()))
          m = int(input())
          b = set()
          for i in range(m):
              b.add(int(input()))
          print(sorted(a | b))
        expect_fail_tag: set.union_vs_intersection
    hints:
      - {es: 'Convierte cada lista en un conjunto y usa `&`.', en: 'Turn each list into a set and use `&`.'}
    explanation:
      es: 'La intersección contiene solo lo que está en los dos conjuntos.'
      en: 'The intersection contains only what is in both sets.'

  - id: py.u07.l04.e09
    type: write_code
    difficulty: 3
    skills: [py.set, py.list, py.compare, py.input]
    prompt:
      es: |
        Lee un entero `n` y luego `n` enteros (uno por línea). Muestra `True` si hay algún valor repetido
        y `False` si todos son distintos.
      en: |
        Read a whole number `n` and then `n` whole numbers (one per line). Show `True` if any value is repeated
        and `False` if all are different.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      n = int(input())
      datos = []
      for i in range(n):
          datos.append(int(input()))
      print(len(set(datos)) != len(datos))
    tests:
      - {stdin: "3\n1\n2\n3\n", expected_stdout: "False\n", visible: true}
      - {stdin: "4\n1\n2\n1\n5\n", expected_stdout: "True\n", visible: false}
      - {stdin: "0\n", expected_stdout: "False\n", visible: false}
    wrong_examples:
      - code: |
          n = int(input())
          datos = []
          for i in range(n):
              datos.append(int(input()))
          print(len(set(datos)) == len(datos))
        expect_fail_tag: logic.inverted_condition
    hints:
      - {es: 'Compara cuántos elementos hay con y sin repetidos.', en: 'Compare how many elements there are with and without repeats.'}
    explanation:
      es: 'Si el conjunto es más pequeño que la lista, hubo repetidos.'
      en: 'If the set is smaller than the list, there were repeats.'
