  - id: py.u05.l02.e08
    type: write_code
    difficulty: 3
    skills: [py.list.methods, py.for, py.input]
    prompt:
      es: |
        Lee un entero `n` y luego `n` enteros (uno por línea). Guárdalos en una lista usando `append`
        y muestra la lista ordenada de menor a mayor.
      en: |
        Read a whole number `n` and then `n` whole numbers (one per line). Store them in a list using `append`
        and show the list sorted from smallest to largest.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      n = int(input())
      lista = []
      for i in range(n):
          lista.append(int(input()))
      lista.sort()
      print(lista)
    tests:
      - {stdin: "3\n5\n1\n3\n", expected_stdout: "[1, 3, 5]\n", visible: true}
      - {stdin: "1\n7\n", expected_stdout: "[7]\n", visible: false}
      - {stdin: "0\n", expected_stdout: "[]\n", visible: false}
    wrong_examples:
      - code: |
          n = int(input())
          lista = []
          for i in range(n):
              lista.append(int(input()))
          print(lista)
        expect_fail_tag: logic.missing_sort
      - code: |
          n = int(input())
          lista = []
          for i in range(n):
              lista.append(int(input()))
          print(lista.sort())
        expect_fail_tag: list.sort_returns_none
    hints:
      - {es: 'Empieza con una lista vacía `[]` y agrégale elementos en el bucle.', en: 'Start with an empty list `[]` and add elements in the loop.'}
      - {es: 'Ordena la lista y después muéstrala; no muestres el resultado de `sort()`.', en: 'Sort the list and then show it; do not show the result of `sort()`.'}
    explanation:
      es: '`sort()` devuelve `None`, así que `print(lista.sort())` mostraría `None`.'
      en: '`sort()` returns `None`, so `print(lista.sort())` would show `None`.'

  - id: py.u05.l02.e09
    type: write_code
    difficulty: 3
    skills: [py.list.methods, py.for, py.input]
    prompt:
      es: |
        Lee un entero `n`, luego `n` enteros y por último un valor `x` (todo uno por línea).
        Borra de la lista la **primera** aparición de `x` y muestra la lista. `x` siempre estará en la lista.
      en: |
        Read a whole number `n`, then `n` whole numbers and finally a value `x` (everything one per line).
        Delete the **first** occurrence of `x` from the list and show the list. `x` will always be in the list.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      n = int(input())
      lista = []
      for i in range(n):
          lista.append(int(input()))
      x = int(input())
      lista.remove(x)
      print(lista)
    tests:
      - {stdin: "4\n1\n2\n3\n2\n2\n", expected_stdout: "[1, 3, 2]\n", visible: true}
      - {stdin: "3\n5\n6\n7\n7\n", expected_stdout: "[5, 6]\n", visible: false}
    wrong_examples:
      - code: |
          n = int(input())
          lista = []
          for i in range(n):
              lista.append(int(input()))
          x = int(input())
          lista.pop(x)
          print(lista)
        expect_fail_tag: list.pop_vs_remove
      - code: |
          n = int(input())
          lista = []
          for i in range(n):
              lista.append(int(input()))
          x = int(input())
          nueva = []
          for e in lista:
              if e != x:
                  nueva.append(e)
          print(nueva)
        expect_fail_tag: list.remove_all_vs_first
    hints:
      - {es: '`remove` borra por valor; `pop` borra por posición.', en: '`remove` deletes by value; `pop` deletes by position.'}
    explanation:
      es: '`pop(x)` interpretaría `x` como un índice y `remove` solo borra la primera aparición, no todas.'
      en: '`pop(x)` would treat `x` as an index and `remove` only deletes the first occurrence, not all of them.'
