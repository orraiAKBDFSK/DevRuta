title:
  es: 'Métodos de listas'
  en: 'List methods'
explanation:
  es: |
    Una lista tiene **métodos**: acciones que se escriben con un punto después del nombre.

    | Método | Qué hace |
    |---|---|
    | `a.append(x)` | agrega `x` al final |
    | `a.insert(i, x)` | inserta `x` en la posición `i` |
    | `a.remove(x)` | borra la **primera** aparición del valor `x` |
    | `a.pop()` / `a.pop(i)` | borra y **devuelve** el último / el de la posición `i` |
    | `a.sort()` | ordena de menor a mayor |
    | `a.reverse()` | invierte el orden |
    | `a.count(x)` | cuenta cuántas veces aparece `x` |

    Atención: `append`, `insert`, `remove`, `sort` y `reverse` **modifican la lista** y devuelven `None`.
    Por eso `a = a.sort()` es un error: dejaría `a` valiendo `None`.
  en: |
    A list has **methods**: actions written with a dot after the name.

    | Method | What it does |
    |---|---|
    | `a.append(x)` | adds `x` at the end |
    | `a.insert(i, x)` | inserts `x` at position `i` |
    | `a.remove(x)` | deletes the **first** occurrence of the value `x` |
    | `a.pop()` / `a.pop(i)` | deletes and **returns** the last one / the one at position `i` |
    | `a.sort()` | sorts from smallest to largest |
    | `a.reverse()` | reverses the order |
    | `a.count(x)` | counts how many times `x` appears |

    Careful: `append`, `insert`, `remove`, `sort` and `reverse` **modify the list** and return `None`.
    That is why `a = a.sort()` is a mistake: it would leave `a` equal to `None`.
