title:
  es: 'Patrones frecuentes con listas'
  en: 'Common patterns with lists'
explanation:
  es: |
    Python trae funciones para los cálculos más comunes sobre listas de números:

    ```python
    datos = [3, 9, 2]
    print(max(datos))             # 9
    print(min(datos))             # 2
    print(sum(datos))             # 14
    print(sum(datos) / len(datos))  # promedio
    print(datos.index(9))         # 1  (posición de la primera aparición)
    ```

    Otros dos patrones muy usados:

    - **Filtrar**: crear una lista nueva con los elementos que cumplen una condición.
    - **Quitar repetidos**: recorrer la lista y agregar un elemento a la nueva solo si `not in` ella.
  en: |
    Python provides functions for the most common calculations on lists of numbers:

    ```python
    datos = [3, 9, 2]
    print(max(datos))             # 9
    print(min(datos))             # 2
    print(sum(datos))             # 14
    print(sum(datos) / len(datos))  # average
    print(datos.index(9))         # 1  (position of the first occurrence)
    ```

    Two more very common patterns:

    - **Filtering**: build a new list with the elements that meet a condition.
    - **Removing duplicates**: walk through the list and add an element to the new one only if it is `not in` it.
