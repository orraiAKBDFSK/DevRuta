title:
  es: 'Recorrer listas'
  en: 'Walking through lists'
explanation:
  es: |
    `for` recorre una lista elemento por elemento:

    ```python
    notas = [7, 9, 6]
    for n in notas:
        print(n)
    ```

    Si además necesitas la **posición**, recorre los índices con `range(len(...))`:

    ```python
    for i in range(len(notas)):
        print(i, notas[i])
    ```

    - `x in lista` responde `True` si `x` está en la lista, y `x not in lista` lo contrario.
    - Para recorrer al revés puedes usar `lista.reverse()` o `range(len(lista) - 1, -1, -1)`.
  en: |
    `for` walks through a list element by element:

    ```python
    notas = [7, 9, 6]
    for n in notas:
        print(n)
    ```

    If you also need the **position**, walk through the indexes with `range(len(...))`:

    ```python
    for i in range(len(notas)):
        print(i, notas[i])
    ```

    - `x in lista` answers `True` if `x` is in the list, and `x not in lista` the opposite.
    - To walk backwards you can use `lista.reverse()` or `range(len(lista) - 1, -1, -1)`.
exercises:
