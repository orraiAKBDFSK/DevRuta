  - id: py.u05.l03.e06
    type: write_code
    difficulty: 3
    skills: [py.list, py.for, py.input]
    prompt:
      es: 'Lee un entero `n` y luego `n` enteros (uno por línea). Guárdalos en una lista y muestra su suma.'
      en: 'Read a whole number `n` and then `n` whole numbers (one per line). Store them in a list and show their sum.'
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      n = int(input())
      lista = []
      for i in range(n):
          lista.append(int(input()))
      total = 0
      for x in lista:
          total = total + x
      print(total)
    tests:
      - {stdin: "3\n1\n2\n3\n", expected_stdout: "6\n", visible: true}
      - {stdin: "1\n5\n", expected_stdout: "5\n", visible: false}
      - {stdin: "0\n", expected_stdout: "0\n", visible: false}
    wrong_examples:
      - code: |
          n = int(input())
          lista = []
          for i in range(n):
              lista.append(int(input()))
          print(len(lista))
        expect_fail_tag: logic.wrong_operation
    hints:
      - {es: 'Primero llena la lista y después recórrela con otro `for`.', en: 'First fill the list and then walk through it with another `for`.'}
    explanation:
      es: 'Son dos bucles: uno para leer los datos y otro para recorrerlos.'
      en: 'There are two loops: one to read the data and another to walk through it.'

  - id: py.u05.l03.e07
    type: write_code
    difficulty: 3
    skills: [py.list, py.for, py.if, py.operators, py.input]
    prompt:
      es: 'Lee un entero `n` y luego `n` enteros (uno por línea). Muestra cuántos de ellos son pares.'
      en: 'Read a whole number `n` and then `n` whole numbers (one per line). Show how many of them are even.'
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      n = int(input())
      lista = []
      for i in range(n):
          lista.append(int(input()))
      pares = 0
      for x in lista:
          if x % 2 == 0:
              pares = pares + 1
      print(pares)
    tests:
      - {stdin: "5\n1\n2\n3\n4\n6\n", expected_stdout: "3\n", visible: true}
      - {stdin: "3\n1\n3\n5\n", expected_stdout: "0\n", visible: false}
      - {stdin: "0\n", expected_stdout: "0\n", visible: false}
    wrong_examples:
      - code: |
          n = int(input())
          lista = []
          for i in range(n):
              lista.append(int(input()))
          print(len(lista))
        expect_fail_tag: logic.wrong_operation
      - code: |
          n = int(input())
          lista = []
          for i in range(n):
              lista.append(int(input()))
          impares = 0
          for x in lista:
              if x % 2 != 0:
                  impares = impares + 1
          print(impares)
        expect_fail_tag: logic.inverted_condition
    hints:
      - {es: 'Usa un contador y un `if` dentro del bucle.', en: 'Use a counter and an `if` inside the loop.'}
    explanation:
      es: 'Es el patrón de contador visto en la unidad anterior, ahora sobre una lista.'
      en: 'It is the counter pattern from the previous unit, now applied to a list.'

  - id: py.u05.l03.e08
    type: write_code
    difficulty: 3
    skills: [py.list, py.for, py.index, py.input]
    prompt:
      es: 'Lee un entero `n` y luego `n` enteros (uno por línea). Muéstralos en orden inverso, uno por línea.'
      en: 'Read a whole number `n` and then `n` whole numbers (one per line). Show them in reverse order, one per line.'
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      n = int(input())
      lista = []
      for i in range(n):
          lista.append(int(input()))
      lista.reverse()
      for x in lista:
          print(x)
    tests:
      - {stdin: "3\n1\n2\n3\n", expected_stdout: "3\n2\n1\n", visible: true}
      - {stdin: "1\n9\n", expected_stdout: "9\n", visible: false}
      - {stdin: "4\n5\n6\n7\n8\n", expected_stdout: "8\n7\n6\n5\n", visible: false}
    wrong_examples:
      - code: |
          n = int(input())
          lista = []
          for i in range(n):
              lista.append(int(input()))
          for x in lista:
              print(x)
        expect_fail_tag: logic.missing_reverse
      - code: |
          n = int(input())
          lista = []
          for i in range(n):
              lista.append(int(input()))
          lista.sort()
          for x in lista:
              print(x)
        expect_fail_tag: list.sort_vs_reverse
    hints:
      - {es: 'Hay un método de listas que invierte el orden.', en: 'There is a list method that reverses the order.'}
    explanation:
      es: '`sort()` ordena por valor; `reverse()` invierte la posición, sin importar los valores.'
      en: '`sort()` orders by value; `reverse()` flips the positions, regardless of the values.'
