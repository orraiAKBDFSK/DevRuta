    explanation:
      es: 'A diferencia del texto, una lista se puede modificar elemento a elemento.'
      en: 'Unlike text, a list can be modified element by element.'

  - id: py.u05.l01.e05
    type: multiple_choice
    difficulty: 2
    skills: [py.index]
    prompt:
      es: |
        Una lista tiene 3 elementos. ¿Qué pasa al ejecutar `a[3]`?

        ```python
        a = [10, 20, 30]
        print(a[3])
        ```
      en: |
        A list has 3 elements. What happens when running `a[3]`?

        ```python
        a = [10, 20, 30]
        print(a[3])
        ```
    options:
      - {es: 'Da un error `IndexError`: el último índice es 2.', en: 'It raises an `IndexError`: the last index is 2.'}
      - {es: 'Muestra 30.', en: 'It shows 30.'}
      - {es: 'Muestra 0.', en: 'It shows 0.'}
      - {es: 'Muestra una lista vacía.', en: 'It shows an empty list.'}
    answer: 0
    distractor_tags: {1: logic.off_by_one, 2: index.misconception}
    hints:
      - {es: 'Con 3 elementos los índices válidos son 0, 1 y 2.', en: 'With 3 elements the valid indexes are 0, 1 and 2.'}
    explanation:
      es: 'El índice válido más alto es `len(a) - 1`.'
      en: 'The highest valid index is `len(a) - 1`.'

