  - id: py.u05.l01.e07
    type: write_code
    difficulty: 2
    skills: [py.list, py.input]
    prompt:
      es: 'Lee tres enteros (uno por línea), guárdalos en una lista en ese orden y muestra la lista.'
      en: 'Read three whole numbers (one per line), store them in a list in that order and show the list.'
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      a = int(input())
      b = int(input())
      c = int(input())
      lista = [a, b, c]
      print(lista)
    tests:
      - {stdin: "3\n1\n2\n", expected_stdout: "[3, 1, 2]\n", visible: true}
      - {stdin: "10\n20\n30\n", expected_stdout: "[10, 20, 30]\n", visible: false}
    wrong_examples:
      - code: |
          a = input()
          b = input()
          c = input()
          print([a, b, c])
        expect_fail_tag: io.input_not_cast
      - code: |
          a = int(input())
          b = int(input())
          c = int(input())
          print(a, b, c)
        expect_fail_tag: output.mismatch
    hints:
      - {es: 'Convierte cada entrada con `int()` antes de guardarla.', en: 'Convert each input with `int()` before storing it.'}
    explanation:
      es: 'Sin `int()`, la lista contendría textos y se mostraría con comillas: `[''3'', ''1'', ''2'']`.'
      en: 'Without `int()`, the list would hold text and be shown with quotes: `[''3'', ''1'', ''2'']`.'

  - id: py.u05.l01.e08
    type: write_code
    difficulty: 3
    skills: [py.list, py.index, py.input]
    prompt:
      es: 'Lee tres enteros (uno por línea), guárdalos en una lista, intercambia el primero con el último y muestra la lista.'
      en: 'Read three whole numbers (one per line), store them in a list, swap the first with the last and show the list.'
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      a = int(input())
      b = int(input())
      c = int(input())
      lista = [a, b, c]
      temporal = lista[0]
      lista[0] = lista[-1]
      lista[-1] = temporal
      print(lista)
    tests:
      - {stdin: "1\n2\n3\n", expected_stdout: "[3, 2, 1]\n", visible: true}
      - {stdin: "5\n6\n7\n", expected_stdout: "[7, 6, 5]\n", visible: false}
    wrong_examples:
      - code: |
          a = int(input())
          b = int(input())
          c = int(input())
          lista = [a, b, c]
          lista[0] = lista[-1]
          lista[-1] = lista[0]
          print(lista)
        expect_fail_tag: logic.swap_without_temp
    hints:
      - {es: 'Si copias un valor encima de otro, el original se pierde. Guarda uno en una variable temporal.', en: 'If you copy a value over another, the original is lost. Save one in a temporary variable.'}
    explanation:
      es: 'Sin variable temporal, los dos extremos acaban con el mismo valor.'
      en: 'Without a temporary variable, both ends end up with the same value.'
