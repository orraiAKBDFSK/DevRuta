  - id: py.u05.l01.e04
    type: predict_output
    difficulty: 2
    skills: [py.list, py.index]
    prompt:
      es: '¿Qué muestra este programa? Escribe la lista tal como la muestra Python, con corchetes y espacios tras las comas.'
      en: 'What does this program show? Write the list the way Python shows it, with brackets and a space after each comma.'
    code: |
      a = [1, 2, 3]
      a[1] = 9
      print(a)
