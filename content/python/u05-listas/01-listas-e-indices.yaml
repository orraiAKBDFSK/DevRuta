title:
  es: 'Listas e índices'
  en: 'Lists and indexes'
explanation:
  es: |
    Una **lista** guarda varios valores en una sola variable, entre corchetes y separados por comas:

    ```python
    notas = [7, 9, 6]
    print(notas)        # [7, 9, 6]
    print(len(notas))   # 3
    ```

    Cada elemento tiene una posición, llamada **índice**, que **empieza en 0**:

    ```python
    print(notas[0])     # 7   (el primero)
    print(notas[2])     # 6
    print(notas[-1])    # 6   (el último)
    ```

    - Un índice negativo cuenta desde el final: `-1` es el último, `-2` el penúltimo.
    - Usar un índice que no existe da un `IndexError`.
    - Las listas se pueden modificar: `notas[0] = 10`.
    - Una lista puede estar vacía: `[]`.
  en: |
    A **list** stores several values in a single variable, between square brackets and separated by commas:

    ```python
    notas = [7, 9, 6]
    print(notas)        # [7, 9, 6]
    print(len(notas))   # 3
    ```

    Each element has a position, called an **index**, that **starts at 0**:

    ```python
    print(notas[0])     # 7   (the first one)
    print(notas[2])     # 6
    print(notas[-1])    # 6   (the last one)
    ```

    - A negative index counts from the end: `-1` is the last, `-2` the second to last.
    - Using an index that does not exist raises an `IndexError`.
    - Lists can be modified: `notas[0] = 10`.
    - A list can be empty: `[]`.
exercises:
  - id: py.u05.l01.e01
    type: predict_output
    difficulty: 1
    skills: [py.index]
    prompt:
      es: '¿Qué muestra este programa?'
      en: 'What does this program show?'
    code: |
      a = [10, 20, 30]
      print(a[0])
    answer: "10"
    hints:
      - {es: 'El primer índice es 0, no 1.', en: 'The first index is 0, not 1.'}
    explanation:
      es: 'Los índices empiezan en 0, así que `a[0]` es el primer elemento.'
      en: 'Indexes start at 0, so `a[0]` is the first element.'

