        ```
      en: |
        What error does this program produce?

        ```python
        print("a")
            print("b")
        ```
    options:
      - {es: '`IndentationError`: la segunda línea está indentada sin motivo.', en: '`IndentationError`: the second line is indented for no reason.'}
      - {es: '`NameError`', en: '`NameError`'}
      - {es: '`TypeError`', en: '`TypeError`'}
      - {es: 'Ninguno, muestra `a` y `b`.', en: 'None, it shows `a` and `b`.'}
    answer: 0
    distractor_tags: {3: indent.wrong}
    hints:
      - {es: 'En Python la indentación forma parte de la sintaxis.', en: 'In Python indentation is part of the syntax.'}
    explanation:
      es: 'Solo se indenta después de una línea que abre un bloque (`if`, `for`, `def`...).'
      en: 'You only indent after a line that opens a block (`if`, `for`, `def`...).'

  - id: py.u09.l01.e09
    type: multiple_choice
    difficulty: 3
    skills: [py.errors.read, py.range]
    prompt:
      es: |
        Este programa falla. ¿Por qué?

        ```python
        numeros = [1, 2, 3]
        total = 0
        for i in range(4):
            total = total + numeros[i]
        print(total)
        ```

        ```
        File "main.py", line 4, in <module>
          total = total + numeros[i]
        IndexError: list index out of range
        ```
      en: |
        This program fails. Why?

        ```python
        numeros = [1, 2, 3]
        total = 0
        for i in range(4):
            total = total + numeros[i]
        print(total)
        ```

        ```
        File "main.py", line 4, in <module>
          total = total + numeros[i]
        IndexError: list index out of range
        ```
    options:
      - {es: '`range(4)` genera el índice 3, y la lista solo tiene índices 0, 1 y 2.', en: '`range(4)` generates the index 3, and the list only has indexes 0, 1 and 2.'}
      - {es: '`total` no está definido.', en: '`total` is not defined.'}
      - {es: 'No se puede sumar dentro de un `for`.', en: 'You cannot add inside a `for`.'}
      - {es: 'La lista debería tener 4 elementos y le falta uno.', en: 'The list should have 4 elements and one is missing.'}
    answer: 0
    distractor_tags: {3: error.blame_data}
    hints:
      - {es: 'Compara cuántas vueltas da el bucle con cuántos elementos hay.', en: 'Compare how many turns the loop takes with how many elements there are.'}
      - {es: 'Mejor aún: usa `range(len(numeros))`.', en: 'Even better: use `range(len(numeros))`.'}
    explanation:
      es: 'En la cuarta vuelta `i` vale 3 y `numeros[3]` no existe. El número de línea y la línea de código apuntan al lugar exacto.'
      en: 'On the fourth turn `i` is 3 and `numeros[3]` does not exist. The line number and the line of code point to the exact place.'

