  - id: py.u09.l01.e07
    type: multiple_choice
    difficulty: 2
    skills: [py.errors.read]
    prompt:
      es: |
        Python no llega a ejecutar este programa y muestra un error. ¿Cuál?

        ```python
        if x > 3
            print("grande")
        ```
      en: |
        Python does not even run this program and shows an error. Which one?

        ```python
        if x > 3
            print("grande")
        ```
    options:
      - {es: '`SyntaxError`, porque falta `:` al final del `if`.', en: '`SyntaxError`, because the `:` at the end of the `if` is missing.'}
      - {es: '`NameError`, porque `x` no existe.', en: '`NameError`, because `x` does not exist.'}
      - {es: '`TypeError`, porque se compara con 3.', en: '`TypeError`, because it is compared with 3.'}
      - {es: '`ValueError`, porque 3 es demasiado pequeño.', en: '`ValueError`, because 3 is too small.'}
    answer: 0
    distractor_tags: {1: error.syntax_vs_runtime}
    hints:
      - {es: 'Los errores de sintaxis se detectan antes de ejecutar nada.', en: 'Syntax errors are detected before anything runs.'}
    explanation:
      es: 'Aunque `x` tampoco exista, Python primero lee todo el programa y se detiene en el error de sintaxis.'
      en: 'Even though `x` does not exist either, Python first reads the whole program and stops at the syntax error.'

  - id: py.u09.l01.e08
    type: multiple_choice
    difficulty: 2
    skills: [py.errors.read]
    prompt:
      es: |
        ¿Qué error produce este programa?

        ```python
        print("a")
