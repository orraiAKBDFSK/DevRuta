title:
  es: 'Leer los mensajes de error'
  en: 'Reading error messages'
explanation:
  es: |
    Cuando un programa falla, Python muestra un **traceback** (rastro del error):

    ```
    Traceback (most recent call last):
      File "main.py", line 3, in <module>
        print(x)
    NameError: name 'x' is not defined
    ```

    Cómo leerlo:

    1. Empieza por la **última línea**: dice el **tipo** de error (`NameError`) y el **motivo**.
    2. Mira el **número de línea** (`line 3`) y la línea de código que se muestra.
    3. Si hay varias llamadas, la última es donde ocurrió el fallo.

    Errores frecuentes:

    | Error | Causa típica |
    |---|---|
    | `SyntaxError` | falta un `:`, un paréntesis o una comilla |
    | `IndentationError` | indentación incorrecta |
    | `NameError` | usar una variable que no existe (o mal escrita) |
    | `TypeError` | operación entre tipos incompatibles, como `"5" + 5` |
    | `ValueError` | valor con el tipo correcto pero inválido, como `int("abc")` |
    | `IndexError` | índice fuera de rango en una lista o texto |
    | `KeyError` | clave inexistente en un diccionario |
    | `ZeroDivisionError` | dividir entre cero |
    | `AttributeError` | método que el objeto no tiene |
  en: |
    When a program fails, Python shows a **traceback**:

    ```
    Traceback (most recent call last):
      File "main.py", line 3, in <module>
        print(x)
    NameError: name 'x' is not defined
    ```

    How to read it:

    1. Start with the **last line**: it gives the error **type** (`NameError`) and the **reason**.
    2. Look at the **line number** (`line 3`) and the line of code shown.
    3. If there are several calls, the last one is where the failure happened.

    Common errors:

    | Error | Typical cause |
    |---|---|
    | `SyntaxError` | a missing `:`, parenthesis or quote |
    | `IndentationError` | wrong indentation |
    | `NameError` | using a variable that does not exist (or is misspelled) |
    | `TypeError` | operation between incompatible types, such as `"5" + 5` |
    | `ValueError` | right type but invalid value, such as `int("abc")` |
    | `IndexError` | index out of range in a list or text |
    | `KeyError` | missing key in a dictionary |
    | `ZeroDivisionError` | dividing by zero |
    | `AttributeError` | a method the object does not have |
exercises:
  - id: py.u09.l01.e01
    type: multiple_choice
    difficulty: 1
    skills: [py.errors.read]
    prompt:
      es: |
        Este programa falla con el siguiente mensaje. ¿Cuál es la causa?

        ```
        Traceback (most recent call last):
          File "main.py", line 3, in <module>
            print(x)
        NameError: name 'x' is not defined
        ```
      en: |
        This program fails with the following message. What is the cause?

        ```
        Traceback (most recent call last):
          File "main.py", line 3, in <module>
            print(x)
        NameError: name 'x' is not defined
        ```
    options:
      - {es: 'La variable `x` no existe en ese punto del programa.', en: 'The variable `x` does not exist at that point in the program.'}
      - {es: '`print` está mal escrito.', en: '`print` is misspelled.'}
      - {es: 'Falta una comilla.', en: 'A quote is missing.'}
      - {es: 'El número es demasiado grande.', en: 'The number is too large.'}
    answer: 0
    distractor_tags: {1: error.confusion, 2: error.confusion}
    hints:
      - {es: 'Lee la última línea del mensaje.', en: 'Read the last line of the message.'}
    explanation:
      es: 'Un `NameError` indica que se usó un nombre que no está definido: puede faltar la asignación o estar mal escrito.'
      en: 'A `NameError` means a name that is not defined was used: the assignment may be missing or the name misspelled.'

