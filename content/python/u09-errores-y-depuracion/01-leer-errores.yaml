      - {es: '`ValueError`', en: '`ValueError`'}
      - {es: '`TypeError`', en: '`TypeError`'}
      - {es: '`SyntaxError`', en: '`SyntaxError`'}
    answer: 0
    distractor_tags: {1: error.confusion, 2: error.confusion}
    hints:
      - {es: 'El nombre del error describe la operación.', en: 'The name of the error describes the operation.'}
    explanation:
      es: 'Dividir entre cero no está definido en matemáticas ni en Python.'
      en: 'Dividing by zero is undefined in mathematics and in Python.'

