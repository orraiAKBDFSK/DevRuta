title:
  es: 'Manejar errores con try y except'
  en: 'Handling errors with try and except'
explanation:
  es: |
    En lugar de dejar que el programa se caiga, puedes **capturar** el error con `try` / `except`:

    ```python
    try:
        n = int(input())
        print(10 / n)
    except ValueError:
        print("no es un número")
    except ZeroDivisionError:
        print("no se puede dividir entre cero")
    ```

    - El código dentro de `try` se ejecuta normalmente; si ocurre un error, Python salta al `except` que coincida.
    - Captura **tipos concretos** de error. Un `except:` sin tipo atrapa todo y esconde fallos reales.
    - `else:` se ejecuta solo si **no** hubo error; `finally:` se ejecuta **siempre**.
    - Un error que no coincide con ningún `except` sigue deteniendo el programa.
  en: |
    Instead of letting the program crash, you can **catch** the error with `try` / `except`:

    ```python
    try:
        n = int(input())
        print(10 / n)
    except ValueError:
        print("no es un número")
    except ZeroDivisionError:
        print("no se puede dividir entre cero")
    ```

    - The code inside `try` runs normally; if an error occurs, Python jumps to the matching `except`.
    - Catch **specific types** of error. A bare `except:` catches everything and hides real failures.
    - `else:` runs only if there was **no** error; `finally:` runs **always**.
    - An error that matches no `except` still stops the program.
exercises:
  - id: py.u09.l02.e01
    type: predict_output
    difficulty: 1
    skills: [py.try]
    prompt:
      es: '¿Qué muestra este programa?'
      en: 'What does this program show?'
    code: |
      try:
          print(int("12"))
      except ValueError:
          print("error")
    answer: "12"
    hints:
      - {es: 'Si no hay error, el `except` no se ejecuta.', en: 'If there is no error, the `except` does not run.'}
    explanation:
      es: '`int("12")` funciona, así que no se activa el `except`.'
      en: '`int("12")` works, so the `except` is not triggered.'

  - id: py.u09.l02.e02
    type: predict_output
    difficulty: 1
    skills: [py.try]
    prompt:
      es: '¿Qué muestra este programa?'
      en: 'What does this program show?'
    code: |
      try:
          print(int("abc"))
      except ValueError:
          print("error")
    answer: "error"
    hints:
      - {es: '`int("abc")` falla antes de que `print` muestre nada.', en: '`int("abc")` fails before `print` shows anything.'}
    explanation:
      es: 'El error salta directamente al `except`.'
      en: 'The error jumps straight to the `except`.'

  - id: py.u09.l02.e03
    type: predict_output
    difficulty: 2
    skills: [py.try]
    prompt:
      es: '¿Qué muestra este programa? Escribe las dos líneas.'
      en: 'What does this program show? Write both lines.'
    code: |
      try:
          print(1 / 0)
      except ZeroDivisionError:
          print("div0")
      print("fin")
    answer: "div0\nfin"
    hints:
      - {es: 'Después del `except`, el programa continúa.', en: 'After the `except`, the program continues.'}
    explanation:
      es: 'Capturar el error evita que el programa termine.'
      en: 'Catching the error prevents the program from ending.'

  - id: py.u09.l02.e04
    type: predict_output
    difficulty: 3
    skills: [py.try]
    prompt:
      es: '¿Qué muestra este programa? Escribe las dos líneas.'
      en: 'What does this program show? Write both lines.'
    code: |
      try:
          x = 1
      except ValueError:
          print("a")
      else:
          print("b")
      finally:
          print("c")
    answer: "b\nc"
    hints:
      - {es: '`else` corre si no hubo error; `finally` corre siempre.', en: '`else` runs if there was no error; `finally` always runs.'}
    explanation:
      es: 'No hubo error, así que se ejecutan `else` y `finally`.'
      en: 'There was no error, so `else` and `finally` run.'

  - id: py.u09.l02.e05
    type: multiple_choice
    difficulty: 2
    skills: [py.try]
    prompt:
      es: |
        ¿Qué ocurre con este programa?

        ```python
        try:
            n = int("x")
        except ZeroDivisionError:
            print("div0")
        ```
      en: |
        What happens with this program?

        ```python
        try:
            n = int("x")
        except ZeroDivisionError:
            print("div0")
        ```
    options:
      - {es: 'Se cae con un `ValueError`, porque el `except` no coincide con ese error.', en: 'It crashes with a `ValueError`, because the `except` does not match that error.'}
      - {es: 'Muestra `div0`.', en: 'It shows `div0`.'}
      - {es: 'No muestra nada y termina bien.', en: 'It shows nothing and ends fine.'}
      - {es: 'Da un `SyntaxError`.', en: 'It raises a `SyntaxError`.'}
    answer: 0
    distractor_tags: {2: try.wrong_exception_type}
    hints:
      - {es: 'Fíjate en el tipo de error que produce `int("x")`.', en: 'Look at the type of error `int("x")` produces.'}
    explanation:
      es: 'Un `except` solo captura el tipo de error que indica.'
      en: 'An `except` only catches the type of error it names.'

  - id: py.u09.l02.e06
