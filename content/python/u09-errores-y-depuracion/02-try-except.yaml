  - id: py.u09.l02.e07
    type: write_code
    difficulty: 3
    skills: [py.try, py.input]
    prompt:
      es: |
        Lee una línea. Si es un entero, muestra su doble; si no, muestra `invalido`.
      en: |
        Read a line. If it is a whole number, show its double; otherwise show `invalido`.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      try:
          n = int(input())
          print(n * 2)
      except ValueError:
          print("invalido")
    tests:
      - {stdin: "5\n", expected_stdout: "10\n", visible: true}
      - {stdin: "abc\n", expected_stdout: "invalido\n", visible: false}
      - {stdin: "3.5\n", expected_stdout: "invalido\n", visible: false}
      - {stdin: "-4\n", expected_stdout: "-8\n", visible: false}
    wrong_examples:
      - code: |
          n = int(input())
          print(n * 2)
        expect_fail_tag: try.missing
    hints:
      - {es: 'Pon la conversión y el `print` dentro del `try`.', en: 'Put the conversion and the `print` inside the `try`.'}
    explanation:
      es: '`int("3.5")` también es un `ValueError`: un entero no admite decimales.'
      en: '`int("3.5")` is also a `ValueError`: a whole number does not accept decimals.'

  - id: py.u09.l02.e08
    type: write_code
    difficulty: 3
    skills: [py.try, py.input]
    prompt:
      es: |
        Lee dos enteros `a` y `b` (uno por línea). Muestra `a / b`, o `error` si `b` es 0.
      en: |
        Read two whole numbers `a` and `b` (one per line). Show `a / b`, or `error` if `b` is 0.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      a = int(input())
      b = int(input())
      try:
          print(a / b)
      except ZeroDivisionError:
          print("error")
    tests:
      - {stdin: "6\n3\n", expected_stdout: "2.0\n", visible: true}
      - {stdin: "5\n0\n", expected_stdout: "error\n", visible: false}
      - {stdin: "0\n4\n", expected_stdout: "0.0\n", visible: false}
    wrong_examples:
      - code: |
          a = int(input())
          b = int(input())
          print(a / b)
        expect_fail_tag: try.missing
    hints:
      - {es: 'Solo la división puede producir el error.', en: 'Only the division can produce the error.'}
    explanation:
      es: 'Capturar `ZeroDivisionError` permite responder con un mensaje en lugar de caerse.'
      en: 'Catching `ZeroDivisionError` lets you answer with a message instead of crashing.'

  - id: py.u09.l02.e09
    type: write_code
    difficulty: 4
    skills: [py.try, py.while, py.input]
    prompt:
      es: |
        Lee líneas hasta que una sea un entero válido y muestra ese primer entero válido. Ignora las líneas inválidas.
      en: |
        Read lines until one is a valid whole number and show that first valid number. Ignore the invalid lines.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      while True:
          try:
              n = int(input())
              break
          except ValueError:
              pass
      print(n)
    tests:
      - {stdin: "x\n-\n7\n", expected_stdout: "7\n", visible: true}
      - {stdin: "3\n", expected_stdout: "3\n", visible: false}
      - {stdin: "a\n4\n9\n", expected_stdout: "4\n", visible: false}
    wrong_examples:
      - code: |
          n = int(input())
          print(n)
        expect_fail_tag: try.missing
    hints:
      - {es: '`while True` repite; `break` sale cuando la conversión funciona.', en: '`while True` repeats; `break` exits when the conversion works.'}
      - {es: '`pass` es una instrucción que no hace nada, útil dentro de un `except`.', en: '`pass` is an instruction that does nothing, useful inside an `except`.'}
    explanation:
      es: 'El `break` solo se alcanza si `int(input())` no falló.'
      en: 'The `break` is only reached if `int(input())` did not fail.'

  - id: py.u09.l02.e10
    type: write_code
    difficulty: 4
    skills: [py.try, py.for, py.strings.methods, py.input]
    prompt:
      es: |
        Lee una línea con elementos separados por espacios. Suma los que son enteros e ignora los demás.
        Muestra la suma y la cantidad de elementos ignorados, separados por un espacio.
        Ejemplo: `1 x 2 y 3` → `6 2`.
      en: |
        Read a line with elements separated by spaces. Add up those that are whole numbers and ignore the rest.
        Show the sum and the number of ignored elements, separated by a space.
        Example: `1 x 2 y 3` → `6 2`.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      total = 0
      ignorados = 0
      for parte in input().split():
          try:
              total = total + int(parte)
          except ValueError:
              ignorados = ignorados + 1
      print(total, ignorados)
    tests:
      - {stdin: "1 x 2 y 3\n", expected_stdout: "6 2\n", visible: true}
      - {stdin: "a b\n", expected_stdout: "0 2\n", visible: false}
      - {stdin: "5\n", expected_stdout: "5 0\n", visible: false}
    wrong_examples:
      - code: |
          total = 0
          for parte in input().split():
              total = total + int(parte)
          print(total, 0)
        expect_fail_tag: try.missing
    hints:
      - {es: 'Pon el `try` dentro del bucle, para decidir elemento por elemento.', en: 'Put the `try` inside the loop, to decide element by element.'}
    explanation:
      es: 'Con el `try` dentro del bucle, un elemento inválido no detiene a los demás.'
      en: 'With the `try` inside the loop, an invalid element does not stop the others.'

  - id: py.u09.l02.e11
    type: write_code
    difficulty: 4
    skills: [py.try, py.index, py.list, py.input]
    prompt:
      es: |
        Dada la lista `[10, 20, 30]`, lee un índice. Muestra el elemento en esa posición;
        `fuera` si el índice no existe; `invalido` si no es un entero.
      en: |
        Given the list `[10, 20, 30]`, read an index. Show the element at that position;
        `fuera` if the index does not exist; `invalido` if it is not a whole number.
    starter: |
      datos = [10, 20, 30]
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      datos = [10, 20, 30]
      try:
          i = int(input())
          print(datos[i])
      except ValueError:
          print("invalido")
      except IndexError:
          print("fuera")
    tests:
      - {stdin: "1\n", expected_stdout: "20\n", visible: true}
      - {stdin: "5\n", expected_stdout: "fuera\n", visible: false}
      - {stdin: "x\n", expected_stdout: "invalido\n", visible: false}
      - {stdin: "-1\n", expected_stdout: "30\n", visible: false}
    wrong_examples:
      - code: |
          datos = [10, 20, 30]
          try:
              i = int(input())
              print(datos[i])
          except ValueError:
              print("invalido")
        expect_fail_tag: try.missing_except
    hints:
      - {es: 'Puedes poner varios `except`, uno por tipo de error.', en: 'You can put several `except` clauses, one per error type.'}
    explanation:
      es: 'El índice -1 es válido, así que no es un error.'
      en: 'The index -1 is valid, so it is not an error.'
