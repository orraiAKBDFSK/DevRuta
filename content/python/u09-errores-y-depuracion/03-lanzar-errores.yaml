title:
  es: 'Lanzar y validar con raise'
  en: 'Raising and validating with raise'
explanation:
  es: |
    Tú también puedes **lanzar** un error cuando algo no es válido, con `raise`:

    ```python
    def leer_edad(texto):
        edad = int(texto)
        if edad < 0:
            raise ValueError("edad negativa")
        return edad

    try:
        leer_edad("-5")
    except ValueError as e:
        print(e)          # edad negativa
    ```

    - `raise TipoDeError("mensaje")` detiene la función y avisa a quien la llamó.
    - `except TipoDeError as e:` guarda el error en `e`; `print(e)` muestra su mensaje.
    - Es mejor que una función **lance un error** a que imprima mensajes: quien la llama decide qué hacer.
    - `finally:` es el lugar para tareas que deben ocurrir pase lo que pase (por ejemplo, cerrar un archivo).
  en: |
    You can also **raise** an error yourself when something is not valid, with `raise`:

    ```python
    def leer_edad(texto):
        edad = int(texto)
        if edad < 0:
            raise ValueError("edad negativa")
        return edad

    try:
        leer_edad("-5")
    except ValueError as e:
        print(e)          # edad negativa
    ```

    - `raise ErrorType("message")` stops the function and warns whoever called it.
    - `except ErrorType as e:` stores the error in `e`; `print(e)` shows its message.
    - It is better for a function to **raise an error** than to print messages: the caller decides what to do.
    - `finally:` is the place for tasks that must happen no matter what (for example, closing a file).
exercises:
  - id: py.u09.l03.e01
    type: predict_output
    difficulty: 2
    skills: [py.try, py.def]
    prompt:
      es: '¿Qué muestra este programa?'
      en: 'What does this program show?'
    code: |
      def f(x):
          if x < 0:
              raise ValueError("negativo")
          return x

      try:
          f(-1)
      except ValueError as e:
          print(e)
    answer: "negativo"
    hints:
      - {es: '`e` contiene el mensaje que se escribió en `raise`.', en: '`e` holds the message written in `raise`.'}
    explanation:
      es: 'El mensaje del error es el que se pasó al lanzarlo.'
      en: 'The message of the error is the one passed when raising it.'

  - id: py.u09.l03.e02
    type: predict_output
    difficulty: 2
    skills: [py.try]
    prompt:
      es: '¿Qué muestra este programa? Escribe las dos líneas.'
      en: 'What does this program show? Write both lines.'
    code: |
      try:
          print("a")
      finally:
          print("b")
    answer: "a\nb"
    hints:
      - {es: '`finally` se ejecuta siempre, también cuando no hay error.', en: '`finally` always runs, also when there is no error.'}
    explanation:
      es: 'Primero el cuerpo del `try` y luego el `finally`.'
      en: 'First the body of the `try` and then the `finally`.'

  - id: py.u09.l03.e03
    type: predict_output
    difficulty: 3
    skills: [py.try, py.def]
    prompt:
      es: '¿Qué muestra este programa?'
      en: 'What does this program show?'
    code: |
      def f():
          raise ValueError("x")

      try:
          f()
          print("no")
      except ValueError:
          print("si")
    answer: "si"
    hints:
      - {es: 'Cuando se lanza un error, el resto del bloque `try` se salta.', en: 'When an error is raised, the rest of the `try` block is skipped.'}
    explanation:
      es: 'El `print("no")` nunca se ejecuta.'
      en: 'The `print("no")` never runs.'

