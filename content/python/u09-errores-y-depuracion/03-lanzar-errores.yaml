  - id: py.u09.l03.e05
    type: multiple_choice
    difficulty: 3
    skills: [py.def, py.try]
    prompt:
      es: 'Una función valida una edad. ¿Qué es mejor práctica cuando la edad es inválida?'
      en: 'A function validates an age. What is better practice when the age is invalid?'
    options:
      - {es: 'Lanzar un error con `raise` para que quien la llama decida qué hacer.', en: 'Raise an error with `raise` so that the caller decides what to do.'}
      - {es: 'Mostrar un mensaje con `print` y seguir como si nada.', en: 'Show a message with `print` and carry on as if nothing happened.'}
      - {es: 'Devolver el texto `"error"` sin avisar de otra forma.', en: 'Return the text `"error"` with no other warning.'}
      - {es: 'Ignorar el problema.', en: 'Ignore the problem.'}
    answer: 0
    distractor_tags: {1: error.print_vs_raise, 2: error.silent_failure}
