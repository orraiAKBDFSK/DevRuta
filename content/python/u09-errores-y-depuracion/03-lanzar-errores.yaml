  - id: py.u09.l03.e07
    type: write_code
    difficulty: 3
    skills: [py.def, py.try, py.input]
    prompt:
      es: |
        Define `dividir(a, b)` que **devuelva** `a / b` y lance `ValueError("division por cero")` si `b` es 0.
        Lee `a` y `b` (enteros, uno por línea) y muestra el resultado, o el mensaje del error si lo hay.
      en: |
        Define `dividir(a, b)` that **returns** `a / b` and raises `ValueError("division por cero")` if `b` is 0.
        Read `a` and `b` (whole numbers, one per line) and show the result, or the error message if there is one.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      def dividir(a, b):
          if b == 0:
              raise ValueError("division por cero")
          return a / b

      x = int(input())
      y = int(input())
      try:
          print(dividir(x, y))
      except ValueError as e:
          print(e)
    tests:
      - {stdin: "6\n3\n", expected_stdout: "2.0\n", visible: true}
      - {stdin: "1\n0\n", expected_stdout: "division por cero\n", visible: false}
    static_checks:
      - {kind: requires_function, name: dividir, returns: true}
    wrong_examples:
      - code: |
          def dividir(a, b):
              return a / b

          x = int(input())
          y = int(input())
          try:
              print(dividir(x, y))
          except ValueError as e:
              print(e)
        expect_fail_tag: error.wrong_exception_type
    hints:
      - {es: 'Revisa `b` antes de dividir y lanza el error tú mismo.', en: 'Check `b` before dividing and raise the error yourself.'}
    explanation:
      es: 'Sin el `raise`, Python lanzaría `ZeroDivisionError`, que este `except` no captura.'
      en: 'Without the `raise`, Python would raise `ZeroDivisionError`, which this `except` does not catch.'

  - id: py.u09.l03.e08
    type: write_code
    difficulty: 4
    skills: [py.def, py.try, py.compare, py.input]
    prompt:
      es: |
        Define `leer_edad(texto)` que **devuelva** la edad como entero. Debe lanzar `ValueError("edad invalida")` si el texto
        no es un entero o si la edad no está entre 0 y 120 (ambos incluidos). Lee un texto y muestra la edad, o el mensaje del error.
      en: |
        Define `leer_edad(texto)` that **returns** the age as a whole number. It must raise `ValueError("edad invalida")` if the text
        is not a whole number or if the age is not between 0 and 120 (both included). Read a text and show the age, or the error message.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      def leer_edad(texto):
          try:
              edad = int(texto)
          except ValueError:
              raise ValueError("edad invalida")
          if edad < 0 or edad > 120:
              raise ValueError("edad invalida")
          return edad

      try:
          print(leer_edad(input()))
      except ValueError as e:
          print(e)
    tests:
      - {stdin: "25\n", expected_stdout: "25\n", visible: true}
      - {stdin: "abc\n", expected_stdout: "edad invalida\n", visible: false}
      - {stdin: "-3\n", expected_stdout: "edad invalida\n", visible: false}
      - {stdin: "200\n", expected_stdout: "edad invalida\n", visible: false}
      - {stdin: "0\n", expected_stdout: "0\n", visible: false}
    static_checks:
      - {kind: requires_function, name: leer_edad, returns: true}
    wrong_examples:
      - code: |
          def leer_edad(texto):
              return int(texto)

          try:
              print(leer_edad(input()))
          except ValueError as e:
              print(e)
        expect_fail_tag: validation.missing_range
    hints:
      - {es: 'Captura el `ValueError` de `int` y lanza el tuyo con el mensaje pedido.', en: 'Catch the `ValueError` from `int` and raise your own with the requested message.'}
    explanation:
      es: 'Cuando el texto no es un número, el mensaje de Python no es el que se pide, por eso se vuelve a lanzar uno propio.'
      en: 'When the text is not a number, Python’s message is not the requested one, which is why you raise one of your own.'

  - id: py.u09.l03.e09
    type: write_code
    difficulty: 3
    skills: [py.try, py.for, py.input]
    prompt:
      es: |
        Lee un entero `n` y luego `n` líneas. Cuenta cuántas son enteros válidos y cuántas no, usando `try`, `except` y `else`.
        Muestra `validos invalidos` separados por un espacio.
      en: |
        Read a whole number `n` and then `n` lines. Count how many are valid whole numbers and how many are not, using `try`, `except` and `else`.
        Show `valid invalid` separated by a space.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      n = int(input())
      validos = 0
      invalidos = 0
      for i in range(n):
          try:
              int(input())
          except ValueError:
              invalidos = invalidos + 1
          else:
              validos = validos + 1
      print(validos, invalidos)
    tests:
      - {stdin: "3\n1\nx\n2\n", expected_stdout: "2 1\n", visible: true}
      - {stdin: "2\na\nb\n", expected_stdout: "0 2\n", visible: false}
      - {stdin: "0\n", expected_stdout: "0 0\n", visible: false}
    wrong_examples:
      - code: |
          n = int(input())
          validos = 0
          invalidos = 0
          for i in range(n):
              try:
                  int(input())
              except ValueError:
                  invalidos = invalidos + 1
          print(validos, invalidos)
        expect_fail_tag: logic.missing_branch
    hints:
      - {es: '`else` es el lugar natural para contar los casos sin error.', en: '`else` is the natural place to count the cases with no error.'}
    explanation:
      es: 'El `else` se ejecuta solo cuando el `try` terminó sin ningún error.'
      en: 'The `else` runs only when the `try` ended with no error.'

  - id: py.u09.l03.e10
    type: write_code
    difficulty: 4
    skills: [py.def, py.try, py.for, py.fstring, py.input]
    prompt:
      es: |
        Una cuenta empieza con saldo 100. Define `retirar(saldo, monto)` que **devuelva** el nuevo saldo y lance
        `ValueError("fondos insuficientes")` si `monto` supera el saldo. Lee un entero `n` y luego `n` montos (uno por línea).
        Para cada monto muestra `ok X` (con el nuevo saldo X) o el mensaje del error. El saldo solo cambia si el retiro es válido.
      en: |
        An account starts with a balance of 100. Define `retirar(saldo, monto)` that **returns** the new balance and raises
        `ValueError("fondos insuficientes")` if `monto` exceeds the balance. Read a whole number `n` and then `n` amounts (one per line).
        For each amount show `ok X` (with the new balance X) or the error message. The balance only changes if the withdrawal is valid.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      def retirar(saldo, monto):
          if monto > saldo:
              raise ValueError("fondos insuficientes")
          return saldo - monto

      saldo = 100
      n = int(input())
      for i in range(n):
          monto = int(input())
          try:
              saldo = retirar(saldo, monto)
              print(f"ok {saldo}")
          except ValueError as e:
              print(e)
    tests:
      - {stdin: "3\n30\n80\n50\n", expected_stdout: "ok 70\nfondos insuficientes\nok 20\n", visible: true}
      - {stdin: "1\n100\n", expected_stdout: "ok 0\n", visible: false}
      - {stdin: "2\n101\n1\n", expected_stdout: "fondos insuficientes\nok 99\n", visible: false}
    static_checks:
      - {kind: requires_function, name: retirar, returns: true}
    wrong_examples:
      - code: |
          def retirar(saldo, monto):
              return saldo - monto

          saldo = 100
          n = int(input())
          for i in range(n):
              monto = int(input())
              try:
                  saldo = retirar(saldo, monto)
                  print(f"ok {saldo}")
              except ValueError as e:
                  print(e)
        expect_fail_tag: validation.missing_check
    hints:
      - {es: 'Si `retirar` lanza un error, la asignación `saldo = ...` no llega a ejecutarse.', en: 'If `retirar` raises an error, the assignment `saldo = ...` never runs.'}
    explanation:
      es: 'Por eso el saldo se conserva intacto cuando el retiro falla.'
      en: 'That is why the balance stays intact when the withdrawal fails.'
