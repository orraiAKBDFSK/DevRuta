title:
  es: 'Módulos y biblioteca estándar'
  en: 'Modules and the standard library'
explanation:
  es: |
    Un **módulo** es un archivo de Python con funciones y datos listos para usar. Python incluye muchos
    (la **biblioteca estándar**) y se cargan con `import`:

    ```python
    import math
    print(math.sqrt(16))          # 4.0
    print(math.floor(3.7), math.ceil(3.2))   # 3 4

    from math import pi           # trae solo un nombre
    print(round(pi, 2))           # 3.14

    from collections import Counter
    c = Counter("abca")
    print(c["a"], c["z"])         # 2 0   (cuenta; 0 si no está)
    print(c.most_common(1))       # [('a', 2)]

    import statistics
    print(statistics.mean([1, 2, 3, 4]))   # 2.5
    ```

    - `import modulo` obliga a escribir `modulo.nombre`; `from modulo import nombre` permite usar `nombre` directamente.
    - Tus propios archivos `.py` también son módulos que puedes importar.
    - Al final de un archivo suele escribirse `if __name__ == "__main__":` seguido del código que debe ejecutarse **solo cuando
      el archivo se ejecuta directamente**, no cuando otro archivo lo importa.
  en: |
    A **module** is a Python file with functions and data ready to use. Python includes many
    (the **standard library**) and they are loaded with `import`:

    ```python
    import math
    print(math.sqrt(16))          # 4.0
    print(math.floor(3.7), math.ceil(3.2))   # 3 4

    from math import pi           # brings only one name
    print(round(pi, 2))           # 3.14

    from collections import Counter
    c = Counter("abca")
    print(c["a"], c["z"])         # 2 0   (counts; 0 if absent)
    print(c.most_common(1))       # [('a', 2)]

    import statistics
    print(statistics.mean([1, 2, 3, 4]))   # 2.5
    ```

    - `import module` requires writing `module.name`; `from module import name` lets you use `name` directly.
    - Your own `.py` files are also modules you can import.
    - At the end of a file you usually write `if __name__ == "__main__":` followed by the code that must run **only when
      the file is run directly**, not when another file imports it.
