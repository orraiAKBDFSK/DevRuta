  - id: py.u10.l03.e10
    type: write_code
    difficulty: 3
    skills: [py.modules, py.fstring, py.operators, py.input]
    prompt:
      es: |
        Lee cuatro enteros (uno por línea): `x1`, `y1`, `x2`, `y2`. Muestra la distancia entre los puntos
        `(x1, y1)` y `(x2, y2)` con dos decimales. Usa `math.sqrt`.
      en: |
        Read four whole numbers (one per line): `x1`, `y1`, `x2`, `y2`. Show the distance between the points
        `(x1, y1)` and `(x2, y2)` with two decimals. Use `math.sqrt`.
    starter: |
      import math

      # Escribe tu código aquí / Write your code here
    reference_solution: |
      import math

      x1 = int(input())
      y1 = int(input())
      x2 = int(input())
      y2 = int(input())
      d = math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2)
      print(f"{d:.2f}")
    tests:
      - {stdin: "0\n0\n3\n4\n", expected_stdout: "5.00\n", visible: true}
      - {stdin: "1\n1\n4\n5\n", expected_stdout: "5.00\n", visible: false}
      - {stdin: "0\n0\n1\n1\n", expected_stdout: "1.41\n", visible: false}
    wrong_examples:
      - code: |
          import math

          x1 = int(input())
          y1 = int(input())
          x2 = int(input())
          y2 = int(input())
          d = math.sqrt((x2 - x1) + (y2 - y1))
          print(f"{d:.2f}")
        expect_fail_tag: logic.wrong_formula
    hints:
      - {es: 'Es el teorema de Pitágoras: raíz de (dx² + dy²).', en: 'It is the Pythagorean theorem: root of (dx² + dy²).'}
    explanation:
      es: 'Para (0,0) y (1,1), la distancia es √2 ≈ 1.41.'
      en: 'For (0,0) and (1,1), the distance is √2 ≈ 1.41.'

  - id: py.u10.l03.e11
    type: write_code
    difficulty: 3
    skills: [py.modules, py.dict, py.tuple, py.input]
    prompt:
      es: |
        Lee una línea de palabras separadas por espacios. Usa `Counter` para mostrar la palabra más frecuente y cuántas veces
        aparece, separadas por un espacio. Si hay empate, la primera que apareció.
      en: |
        Read a line of words separated by spaces. Use `Counter` to show the most frequent word and how many times
        it appears, separated by a space. If there is a tie, the first one that appeared.
    starter: |
      from collections import Counter

      # Escribe tu código aquí / Write your code here
    reference_solution: |
      from collections import Counter

      palabras = input().split()
      palabra, veces = Counter(palabras).most_common(1)[0]
      print(palabra, veces)
    tests:
      - {stdin: "a b a c b a\n", expected_stdout: "a 3\n", visible: true}
      - {stdin: "x y\n", expected_stdout: "x 1\n", visible: false}
      - {stdin: "z z y y y\n", expected_stdout: "y 3\n", visible: false}
    wrong_examples:
      - code: |
          from collections import Counter

          palabras = input().split()
          print(len(palabras))
        expect_fail_tag: logic.wrong_operation
    hints:
      - {es: '`most_common(1)[0]` es la tupla `(palabra, veces)`; desempaquétala.', en: '`most_common(1)[0]` is the tuple `(palabra, veces)`; unpack it.'}
    explanation:
      es: 'Los empates se resuelven en orden de aparición.'
      en: 'Ties are resolved in order of appearance.'

  - id: py.u10.l03.e12
    type: write_code
    difficulty: 4
    skills: [py.modules, py.def, py.return, py.fstring, py.input]
    prompt:
      es: |
        Define `area_circulo(r)` que **devuelva** el área de un círculo de radio `r` (usa `math.pi`). Escribe el código principal
        dentro de `if __name__ == "__main__":`: lee un radio (puede tener decimales) y muestra el área con dos decimales.
      en: |
        Define `area_circulo(r)` that **returns** the area of a circle of radius `r` (use `math.pi`). Write the main code
        inside `if __name__ == "__main__":`: read a radius (it may have decimals) and show the area with two decimals.
    starter: |
      import math

      # Escribe tu código aquí / Write your code here
    reference_solution: |
      import math

      def area_circulo(r):
          return math.pi * r ** 2

      if __name__ == "__main__":
          radio = float(input())
          print(f"{area_circulo(radio):.2f}")
    tests:
      - {stdin: "1\n", expected_stdout: "3.14\n", visible: true}
      - {stdin: "2\n", expected_stdout: "12.57\n", visible: false}
      - {stdin: "0\n", expected_stdout: "0.00\n", visible: false}
    static_checks:
      - {kind: requires_function, name: area_circulo, returns: true}
    wrong_examples:
      - code: |
          import math

          def area_circulo(r):
              return math.pi * r

          if __name__ == "__main__":
              radio = float(input())
              print(f"{area_circulo(radio):.2f}")
        expect_fail_tag: logic.wrong_formula
    hints:
      - {es: 'Área = π × r².', en: 'Area = π × r².'}
    explanation:
      es: 'Separar la función del código principal permite reutilizar la función desde otros archivos.'
      en: 'Separating the function from the main code lets you reuse the function from other files.'
