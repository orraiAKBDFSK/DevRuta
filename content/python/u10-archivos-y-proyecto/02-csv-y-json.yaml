title:
  es: 'Datos estructurados: CSV y JSON'
  en: 'Structured data: CSV and JSON'
explanation:
  es: |
    Los datos suelen guardarse en formatos estándar.

    **CSV simple**: una fila por línea y valores separados por comas, p. ej. `ana,20`. Se procesa con `split(",")`.

    **JSON**: formato de texto para diccionarios, listas, números, textos, `true`/`false`/`null`.
    Python lo maneja con la biblioteca `json` (`import json` la carga; verás más en la siguiente lección):

    ```python
    import json

    texto = json.dumps({"a": 1, "b": [1, 2]})   # objeto -> texto: {"a": 1, "b": [1, 2]}
    datos = json.loads('{"x": 5}')              # texto -> objeto
    print(datos["x"])                           # 5

    with open("d.json", "w") as f:
        json.dump(datos, f)                     # objeto -> archivo
    with open("d.json") as f:
        leido = json.load(f)                    # archivo -> objeto
    ```

    - JSON usa **comillas dobles**; no admite comas finales ni comillas simples.
    - Las tuplas se guardan como listas y las claves de los diccionarios pasan a ser **textos**.
  en: |
    Data is often stored in standard formats.

    **Simple CSV**: one row per line and comma-separated values, e.g. `ana,20`. It is processed with `split(",")`.

    **JSON**: a text format for dictionaries, lists, numbers, texts, `true`/`false`/`null`.
    Python handles it with the `json` library (`import json` loads it; you will see more in the next lesson):

    ```python
    import json

    texto = json.dumps({"a": 1, "b": [1, 2]})   # object -> text: {"a": 1, "b": [1, 2]}
    datos = json.loads('{"x": 5}')              # text -> object
    print(datos["x"])                           # 5

    with open("d.json", "w") as f:
        json.dump(datos, f)                     # object -> file
    with open("d.json") as f:
        leido = json.load(f)                    # file -> object
    ```

    - JSON uses **double quotes**; it does not allow trailing commas or single quotes.
    - Tuples are stored as lists and dictionary keys become **texts**.
exercises:
  - id: py.u10.l02.e01
    type: predict_output
    difficulty: 1
    skills: [py.files, py.modules]
    prompt:
      es: '¿Qué muestra este programa? Fíjate en las comillas.'
      en: 'What does this program show? Mind the quotes.'
    code: |
      import json

      print(json.dumps({"a": 1, "b": [1, 2]}))
    answer: "{\"a\": 1, \"b\": [1, 2]}"
    hints:
      - {es: 'JSON usa comillas dobles.', en: 'JSON uses double quotes.'}
    explanation:
      es: 'A diferencia de `print(diccionario)`, el resultado de `json.dumps` usa comillas dobles.'
      en: 'Unlike `print(dictionary)`, the result of `json.dumps` uses double quotes.'

