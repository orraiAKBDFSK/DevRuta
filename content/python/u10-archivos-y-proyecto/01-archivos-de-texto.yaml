title:
  es: 'Leer y escribir archivos de texto'
  en: 'Reading and writing text files'
explanation:
  es: |
    Un programa puede guardar datos en un **archivo** y leerlos después. La forma recomendada es `with open(...)`,
    que cierra el archivo automáticamente al terminar el bloque:

    ```python
    with open("notas.txt", "w") as f:     # "w" = escribir (borra lo anterior)
        f.write("uno\ndos\n")             # hay que poner \n para cambiar de línea

    with open("notas.txt") as f:          # modo "r" (leer) por defecto
        print(f.read())                   # todo el contenido como un texto

    with open("notas.txt") as f:
        for linea in f:                   # una línea por vuelta
            print(linea.strip())          # strip() quita el \n final
    ```

    | Modo | Qué hace |
    |---|---|
    | `"r"` | leer (falla con `FileNotFoundError` si no existe) |
    | `"w"` | escribir; **borra** el contenido anterior o crea el archivo |
    | `"a"` | agregar al final; crea el archivo si no existe |

    Otros métodos útiles: `f.readlines()` (lista de líneas) y `f.readline()` (una línea).
  en: |
    A program can save data in a **file** and read it later. The recommended way is `with open(...)`,
    which closes the file automatically at the end of the block:

    ```python
    with open("notas.txt", "w") as f:     # "w" = write (erases what was there)
        f.write("uno\ndos\n")             # you must add \n to change line

    with open("notas.txt") as f:          # mode "r" (read) by default
        print(f.read())                   # the whole content as one text

    with open("notas.txt") as f:
        for linea in f:                   # one line per turn
            print(linea.strip())          # strip() removes the trailing \n
    ```

    | Mode | What it does |
    |---|---|
    | `"r"` | read (fails with `FileNotFoundError` if it does not exist) |
    | `"w"` | write; **erases** the previous content or creates the file |
    | `"a"` | append at the end; creates the file if it does not exist |

    Other useful methods: `f.readlines()` (list of lines) and `f.readline()` (one line).
exercises:
  - id: py.u10.l01.e01
    type: predict_output
    difficulty: 1
    skills: [py.files]
    prompt:
      es: '¿Qué muestra este programa?'
      en: 'What does this program show?'
    code: |
      with open("a.txt", "w") as f:
          f.write("hola")

      with open("a.txt") as f:
          print(f.read())
    answer: "hola"
    hints:
      - {es: 'Primero se escribe el archivo y después se lee.', en: 'First the file is written and then read.'}
    explanation:
      es: 'Lo que se escribe con `"w"` se puede leer después con `read()`.'
      en: 'What is written with `"w"` can be read later with `read()`.'

  - id: py.u10.l01.e02
    type: predict_output
    difficulty: 2
    skills: [py.files]
    prompt:
      es: '¿Qué muestra este programa? Escribe las dos líneas.'
      en: 'What does this program show? Write both lines.'
    code: |
      with open("a.txt", "w") as f:
          f.write("uno\ndos\n")

      with open("a.txt") as f:
          for linea in f:
              print(linea.strip())
    answer: "uno\ndos"
    hints:
      - {es: 'Cada línea del archivo termina con `\n`.', en: 'Each line of the file ends with `\n`.'}
    explanation:
      es: '`strip()` quita ese `\n`, y `print` agrega el suyo.'
      en: '`strip()` removes that `\n`, and `print` adds its own.'

  - id: py.u10.l01.e03
    type: predict_output
    difficulty: 2
    skills: [py.files]
    prompt:
      es: '¿Qué muestra este programa? Escribe la lista tal como la muestra Python.'
      en: 'What does this program show? Write the list the way Python shows it.'
    code: |
      with open("a.txt", "w") as f:
          f.write("a\n")

      with open("a.txt", "a") as f:
          f.write("b\n")

      with open("a.txt") as f:
          print(f.read().split())
    answer: "['a', 'b']"
    hints:
      - {es: 'El modo `"a"` agrega al final sin borrar.', en: 'Mode `"a"` appends at the end without erasing.'}
    explanation:
      es: 'El archivo contiene `a`, salto de línea, `b`, salto de línea; `split()` los separa.'
      en: 'The file contains `a`, a line break, `b`, a line break; `split()` separates them.'

  - id: py.u10.l01.e04
    type: predict_output
    difficulty: 2
    skills: [py.files, py.list]
    prompt:
      es: '¿Qué muestra este programa?'
      en: 'What does this program show?'
    code: |
      with open("a.txt", "w") as f:
          f.write("x\ny\nz\n")

      with open("a.txt") as f:
          print(len(f.readlines()))
    answer: "3"
    hints:
      - {es: '`readlines()` devuelve una lista con una línea por elemento.', en: '`readlines()` returns a list with one line per element.'}
    explanation:
      es: 'Tres líneas, tres elementos.'
      en: 'Three lines, three elements.'

  - id: py.u10.l01.e05
    type: multiple_choice
    difficulty: 2
    skills: [py.files]
    prompt:
      es: '¿Cuál es la diferencia entre abrir un archivo con `"w"` y con `"a"`?'
      en: 'What is the difference between opening a file with `"w"` and with `"a"`?'
    options:
      - {es: '`"w"` borra el contenido anterior; `"a"` agrega al final.', en: '`"w"` erases the previous content; `"a"` appends at the end.'}
      - {es: '`"w"` agrega al final; `"a"` borra el contenido anterior.', en: '`"w"` appends at the end; `"a"` erases the previous content.'}
      - {es: 'No hay diferencia.', en: 'There is no difference.'}
      - {es: '`"a"` solo funciona con números.', en: '`"a"` only works with numbers.'}
    answer: 0
    distractor_tags: {1: file.mode_confusion, 2: file.mode_confusion}
    hints:
      - {es: '"a" viene de "append" (agregar).', en: '"a" comes from "append".'}
    explanation:
      es: 'Abrir con `"w"` un archivo importante por error puede borrar sus datos.'
      en: 'Opening an important file with `"w"` by mistake can erase its data.'

