  - id: py.u10.l01.e08
    type: write_code
    difficulty: 3
    skills: [py.files, py.for, py.strings.methods, py.input]
    prompt:
      es: |
        Lee un entero `n` y luego `n` líneas de texto. Guárdalas en el archivo `datos.txt` (una por línea),
        vuelve a abrirlo y muestra cada línea en mayúsculas.
      en: |
        Read a whole number `n` and then `n` lines of text. Save them in the file `datos.txt` (one per line),
        open it again and show each line in uppercase.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      n = int(input())
      with open("datos.txt", "w") as f:
          for i in range(n):
              f.write(input() + "\n")

      with open("datos.txt") as f:
          for linea in f:
              print(linea.strip().upper())
    tests:
      - {stdin: "2\nhola\nmundo\n", expected_stdout: "HOLA\nMUNDO\n", visible: true}
      - {stdin: "1\nabc def\n", expected_stdout: "ABC DEF\n", visible: false}
      - {stdin: "0\n", expected_stdout: "", visible: false}
    wrong_examples:
      - code: |
          n = int(input())
          with open("datos.txt", "w") as f:
              for i in range(n):
                  f.write(input() + "\n")

          with open("datos.txt") as f:
              for linea in f:
                  print(linea.strip())
        expect_fail_tag: logic.missing_step
    hints:
      - {es: 'Al escribir, agrega `"\n"` a cada línea.', en: 'When writing, add `"\n"` to each line.'}
      - {es: 'Al leer, usa `strip()` para quitar el salto de línea sobrante.', en: 'When reading, use `strip()` to remove the extra line break.'}
    explanation:
      es: 'Sin `strip()`, `print` agregaría una línea en blanco tras cada línea.'
      en: 'Without `strip()`, `print` would add a blank line after each line.'

  - id: py.u10.l01.e09
    type: write_code
    difficulty: 3
    skills: [py.files, py.try]
    prompt:
      es: |
        Intenta abrir y mostrar el archivo `no_existe.txt`. Como no existe, el programa no debe caerse:
        debe mostrar `no existe`.
      en: |
        Try to open and show the file `no_existe.txt`. Since it does not exist, the program must not crash:
        it must show `no existe`.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      try:
          with open("no_existe.txt") as f:
              print(f.read())
      except FileNotFoundError:
          print("no existe")
    tests:
      - {stdin: "", expected_stdout: "no existe\n", visible: true}
    wrong_examples:
      - code: |
          with open("no_existe.txt") as f:
              print(f.read())
        expect_fail_tag: try.missing
    hints:
      - {es: 'El error que buscas se llama `FileNotFoundError`.', en: 'The error you are looking for is called `FileNotFoundError`.'}
    explanation:
      es: 'Abrir un archivo es una operación que puede fallar, así que conviene protegerla con `try`.'
      en: 'Opening a file is an operation that can fail, so it is worth protecting with `try`.'

  - id: py.u10.l01.e10
    type: write_code
    difficulty: 3
    skills: [py.files, py.list, py.input]
    prompt:
      es: |
        Lee un entero `n` (1 o mayor) y luego `n` entradas de texto. Agrégalas, una por línea, al archivo `log.txt`
        (ábrelo con modo `"a"`). Después lee el archivo y muestra la cantidad de líneas y la última, separadas por un espacio.
      en: |
        Read a whole number `n` (1 or greater) and then `n` text entries. Append them, one per line, to the file `log.txt`
        (open it with mode `"a"`). Then read the file and show the number of lines and the last one, separated by a space.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      n = int(input())
      with open("log.txt", "a") as f:
          for i in range(n):
              f.write(input() + "\n")

      lineas = []
      with open("log.txt") as f:
          for linea in f:
              lineas.append(linea.strip())
      print(len(lineas), lineas[-1])
    tests:
      - {stdin: "3\na\nb\nc\n", expected_stdout: "3 c\n", visible: true}
      - {stdin: "1\nsolo\n", expected_stdout: "1 solo\n", visible: false}
    wrong_examples:
      - code: |
          n = int(input())
          with open("log.txt", "a") as f:
              for i in range(n):
                  f.write(input())

          lineas = []
          with open("log.txt") as f:
              for linea in f:
                  lineas.append(linea.strip())
          print(len(lineas), lineas[-1])
        expect_fail_tag: file.newline_missing
    hints:
      - {es: 'Si no escribes `"\n"`, todo quedará en una sola línea.', en: 'If you do not write `"\n"`, everything ends up on a single line.'}
    explanation:
      es: 'El modo `"a"` es el habitual para archivos de registro (*logs*).'
      en: 'Mode `"a"` is the usual one for log files.'

  - id: py.u10.l01.e11
    type: write_code
    difficulty: 3
    skills: [py.files, py.strings.methods, py.input]
    prompt:
      es: |
        Lee un entero `n` y luego `n` líneas de texto. Guárdalas en un archivo, léelas de nuevo
        y muestra cuántas palabras hay en total.
      en: |
        Read a whole number `n` and then `n` lines of text. Save them in a file, read them back
        and show how many words there are in total.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      n = int(input())
      with open("texto.txt", "w") as f:
          for i in range(n):
              f.write(input() + "\n")

      palabras = 0
      with open("texto.txt") as f:
          for linea in f:
              palabras = palabras + len(linea.split())
      print(palabras)
    tests:
      - {stdin: "2\nhola mundo\nadios\n", expected_stdout: "3\n", visible: true}
      - {stdin: "1\na b c d\n", expected_stdout: "4\n", visible: false}
      - {stdin: "0\n", expected_stdout: "0\n", visible: false}
    wrong_examples:
      - code: |
          n = int(input())
          with open("texto.txt", "w") as f:
              for i in range(n):
                  f.write(input() + "\n")

          lineas = 0
          with open("texto.txt") as f:
              for linea in f:
                  lineas = lineas + 1
          print(lineas)
        expect_fail_tag: logic.wrong_operation
    hints:
      - {es: 'Cuenta las palabras de cada línea con `len(linea.split())`.', en: 'Count the words of each line with `len(linea.split())`.'}
    explanation:
      es: 'Un acumulador sobre las líneas del archivo suma las palabras de cada una.'
      en: 'An accumulator over the lines of the file adds up the words of each one.'
