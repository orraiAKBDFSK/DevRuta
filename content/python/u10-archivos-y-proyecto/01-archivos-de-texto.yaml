  - id: py.u10.l01.e07
    type: fill_code
    difficulty: 2
    skills: [py.files]
    prompt:
      es: 'Completa el modo para que se cree el archivo y el programa muestre `x`.'
      en: 'Fill in the mode so the file is created and the program shows `x`.'
    code: |
      with open("n.txt", "___") as f:
          f.write("x")

      with open("n.txt") as f:
