title:
  es: 'Devolver valores con return'
  en: 'Returning values with return'
explanation:
  es: |
    Una función puede **devolver** un resultado con `return`, para usarlo después:

    ```python
    def doble(x):
        return x * 2

    resultado = doble(4)
    print(resultado)        # 8
    print(doble(4) + 1)     # 9
    ```

    - `return` entrega un valor a quien llamó a la función **y termina la función** al instante.
    - Una función sin `return` devuelve `None` (la ausencia de valor).
    - **`print` y `return` no son lo mismo**: `print` muestra algo en pantalla; `return` entrega un valor
      que el resto del programa puede guardar y reutilizar.
  en: |
    A function can **return** a result with `return`, so you can use it later:

    ```python
    def doble(x):
        return x * 2

    resultado = doble(4)
    print(resultado)        # 8
    print(doble(4) + 1)     # 9
    ```

    - `return` hands a value to whoever called the function **and ends the function** immediately.
    - A function without `return` returns `None` (the absence of a value).
    - **`print` and `return` are not the same**: `print` shows something on screen; `return` hands over a value
      that the rest of the program can store and reuse.
