        f()
        print(y)
        ```
      en: |
        What happens when running this program?

        ```python
        def f():
            y = 3

        f()
        print(y)
        ```
    options:
      - {es: 'Da un `NameError`: `y` solo existe dentro de `f`.', en: 'It raises a `NameError`: `y` only exists inside `f`.'}
      - {es: 'Muestra 3.', en: 'It shows 3.'}
      - {es: 'Muestra `None`.', en: 'It shows `None`.'}
      - {es: 'Muestra 0.', en: 'It shows 0.'}
    answer: 0
    distractor_tags: {1: scope.local_leak}
    hints:
      - {es: 'Las variables creadas dentro de una función son locales.', en: 'Variables created inside a function are local.'}
    explanation:
      es: 'Al terminar la función, `y` desaparece.'
      en: 'When the function ends, `y` disappears.'

