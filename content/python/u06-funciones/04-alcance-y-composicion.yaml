  - id: py.u06.l04.e07
    type: write_code
    difficulty: 3
    skills: [py.return, py.def, py.list, py.operators, py.input]
    prompt:
      es: |
        Define `cuenta_pares(lista)` que **devuelva** cuántos números pares hay en la lista.
        Lee un entero `n` y luego `n` enteros (uno por línea), y muestra el resultado.
      en: |
        Define `cuenta_pares(lista)` that **returns** how many even numbers are in the list.
        Read a whole number `n` and then `n` whole numbers (one per line), and show the result.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      def cuenta_pares(lista):
          cuenta = 0
          for x in lista:
              if x % 2 == 0:
                  cuenta = cuenta + 1
          return cuenta

      n = int(input())
      datos = []
      for i in range(n):
          datos.append(int(input()))
      print(cuenta_pares(datos))
    tests:
      - {stdin: "5\n1\n2\n3\n4\n6\n", expected_stdout: "3\n", visible: true}
      - {stdin: "0\n", expected_stdout: "0\n", visible: false}
      - {stdin: "3\n1\n3\n5\n", expected_stdout: "0\n", visible: false}
    static_checks:
      - {kind: requires_function, name: cuenta_pares, returns: true}
    wrong_examples:
      - code: |
          def cuenta_pares(lista):
              return len(lista)

          n = int(input())
          datos = []
          for i in range(n):
              datos.append(int(input()))
          print(cuenta_pares(datos))
        expect_fail_tag: logic.wrong_operation
    hints:
      - {es: 'El contador se crea dentro de la función y se devuelve al final.', en: 'The counter is created inside the function and returned at the end.'}
    explanation:
      es: 'La variable `cuenta` es local: nace y muere dentro de la función.'
      en: 'The variable `cuenta` is local: it is born and dies inside the function.'

  - id: py.u06.l04.e08
    type: write_code
    difficulty: 4
    skills: [py.def, py.return, py.for, py.if, py.input]
    prompt:
      es: |
        Define `es_primo(n)` que **devuelva** `True` si `n` (2 o mayor) es primo y `False` si no.
        Lee `n` y muestra, uno por línea, todos los primos entre 2 y `n` (ambos incluidos). Si `n` es 1, no muestres nada.
      en: |
        Define `es_primo(n)` that **returns** `True` if `n` (2 or greater) is prime and `False` otherwise.
        Read `n` and show, one per line, all the primes between 2 and `n` (both included). If `n` is 1, show nothing.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      def es_primo(n):
          for d in range(2, n):
              if n % d == 0:
                  return False
          return True

      n = int(input())
      for i in range(2, n + 1):
          if es_primo(i):
              print(i)
    tests:
      - {stdin: "10\n", expected_stdout: "2\n3\n5\n7\n", visible: true}
      - {stdin: "2\n", expected_stdout: "2\n", visible: false}
      - {stdin: "7\n", expected_stdout: "2\n3\n5\n7\n", visible: false}
      - {stdin: "1\n", expected_stdout: "", visible: false}
    static_checks:
      - {kind: requires_function, name: es_primo, returns: true}
    wrong_examples:
      - code: |
          def es_primo(n):
              for d in range(2, n):
                  if n % d == 0:
                      return False
              return True

          n = int(input())
          for i in range(2, n):
              if es_primo(i):
                  print(i)
        expect_fail_tag: logic.off_by_one
      - code: |
          def es_primo(n):
              for d in range(2, n):
                  if n % d == 0:
                      return False
                  return True

          n = int(input())
          for i in range(2, n + 1):
              if es_primo(i):
                  print(i)
        expect_fail_tag: function.return_inside_loop
    hints:
      - {es: 'Si algún divisor divide a `n`, devuelve `False` de inmediato.', en: 'If any divisor divides `n`, return `False` right away.'}
      - {es: 'El `return True` va al final, después del bucle.', en: 'The `return True` goes at the end, after the loop.'}
    explanation:
      es: 'Un `return` dentro del bucle termina la función en cuanto se cumple; el `True` final solo se alcanza si ningún divisor sirvió.'
      en: 'A `return` inside the loop ends the function as soon as it triggers; the final `True` is only reached if no divisor worked.'

  - id: py.u06.l04.e09
    type: write_code
    difficulty: 3
    skills: [py.def, py.return, py.for, py.strings.basic, py.input]
    prompt:
      es: |
        Define `invertir(texto)` que **devuelva** el texto al revés (sin usar `reverse`). Lee una palabra y muestra el resultado.
      en: |
        Define `invertir(texto)` that **returns** the text reversed (without using `reverse`). Read a word and show the result.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      def invertir(texto):
          resultado = ""
          for letra in texto:
              resultado = letra + resultado
          return resultado

      print(invertir(input()))
    tests:
      - {stdin: "hola\n", expected_stdout: "aloh\n", visible: true}
      - {stdin: "a\n", expected_stdout: "a\n", visible: false}
      - {stdin: "python\n", expected_stdout: "nohtyp\n", visible: false}
    static_checks:
      - {kind: requires_function, name: invertir, returns: true}
    wrong_examples:
      - code: |
          def invertir(texto):
              resultado = ""
              for letra in texto:
                  resultado = resultado + letra
              return resultado

          print(invertir(input()))
        expect_fail_tag: logic.order_not_reversed
    hints:
      - {es: 'Cada letra nueva debe ir delante de lo que ya tienes.', en: 'Each new letter must go in front of what you already have.'}
    explanation:
      es: 'Con `letra + resultado` cada letra se coloca al principio, invirtiendo el orden.'
      en: 'With `letra + resultado` each letter is placed at the start, reversing the order.'
