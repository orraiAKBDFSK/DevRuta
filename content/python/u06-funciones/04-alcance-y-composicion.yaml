title:
  es: 'Alcance de las variables y composición'
  en: 'Variable scope and composition'
explanation:
  es: |
    Las variables creadas **dentro** de una función son **locales**: solo existen mientras se ejecuta.
    Fuera de ella no se pueden usar.

    ```python
    x = 5

    def f():
        x = 10          # otra variable, local a f
        return x

    print(f())   # 10
    print(x)     # 5
    ```

    - Los **parámetros** también son locales.
    - Una función puede **leer** una variable externa, pero es mejor pasarle los datos como argumentos
      y recibir el resultado con `return`: así es más fácil de entender y de probar.
    - Con números y textos, reasignar un parámetro no cambia la variable original.
    - Con **listas**, un método como `append` dentro de la función **sí modifica** la lista original,
      porque es la misma lista.
    - Las funciones pueden llamarse entre sí: eso se llama **composición** y permite dividir un problema grande
      en piezas pequeñas.
  en: |
    Variables created **inside** a function are **local**: they only exist while it runs.
    You cannot use them outside.

    ```python
    x = 5

    def f():
        x = 10          # another variable, local to f
        return x

    print(f())   # 10
    print(x)     # 5
    ```

    - **Parameters** are local too.
    - A function can **read** an outside variable, but it is better to pass the data as arguments
      and receive the result with `return`: that way it is easier to understand and test.
    - With numbers and text, reassigning a parameter does not change the original variable.
    - With **lists**, a method like `append` inside the function **does** modify the original list,
      because it is the same list.
    - Functions can call each other: this is called **composition** and lets you split a big problem
      into small pieces.
exercises:
  - id: py.u06.l04.e01
    type: predict_output
    difficulty: 2
    skills: [py.scope]
    prompt:
      es: '¿Qué muestra este programa? Escribe las dos líneas.'
      en: 'What does this program show? Write both lines.'
    code: |
      x = 5

      def f():
          x = 10
          return x

      print(f())
      print(x)
    answer: "10\n5"
    hints:
      - {es: 'La `x` de dentro de la función es otra variable.', en: 'The `x` inside the function is another variable.'}
    explanation:
      es: 'La `x` local no cambia la `x` de fuera.'
      en: 'The local `x` does not change the outer `x`.'

  - id: py.u06.l04.e02
