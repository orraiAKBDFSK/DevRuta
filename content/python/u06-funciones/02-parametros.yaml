  - id: py.u06.l02.e07
    type: write_code
    difficulty: 3
    skills: [py.params, py.def, py.input]
    prompt:
      es: |
        Define una función `mostrar_area(base, altura)` que muestre el área de un rectángulo (base por altura).
        Lee la base y la altura (enteros, una por línea) y llama a la función.
      en: |
        Define a function `mostrar_area(base, altura)` that shows the area of a rectangle (base times height).
        Read the base and the height (whole numbers, one per line) and call the function.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      def mostrar_area(base, altura):
          print(base * altura)

      b = int(input())
      a = int(input())
      mostrar_area(b, a)
    tests:
      - {stdin: "3\n4\n", expected_stdout: "12\n", visible: true}
      - {stdin: "5\n5\n", expected_stdout: "25\n", visible: false}
      - {stdin: "7\n1\n", expected_stdout: "7\n", visible: false}
    static_checks:
      - {kind: requires_function, name: mostrar_area}
    wrong_examples:
      - code: |
          b = int(input())
          a = int(input())
          print(b * a)
        expect_fail_tag: static.no_function
      - code: |
          def mostrar_area(base, altura):
              print(base + altura)

          b = int(input())
          a = int(input())
          mostrar_area(b, a)
        expect_fail_tag: logic.wrong_operation
    hints:
      - {es: 'La función recibe dos parámetros y muestra el producto.', en: 'The function receives two parameters and shows the product.'}
    explanation:
      es: 'Los datos se leen fuera de la función y se le pasan como argumentos.'
      en: 'The data is read outside the function and passed to it as arguments.'

  - id: py.u06.l02.e08
    type: write_code
    difficulty: 3
    skills: [py.params, py.def, py.for, py.input]
    prompt:
      es: |
        Define `repetir(texto, veces)` que muestre `texto` en una línea distinta, `veces` veces.
        Lee el texto y luego `veces` (entero), cada uno en su línea, y llama a la función.
      en: |
        Define `repetir(texto, veces)` that shows `texto` on a separate line, `veces` times.
        Read the text and then `veces` (whole number), each on its own line, and call the function.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      def repetir(texto, veces):
          for i in range(veces):
              print(texto)

      t = input()
      v = int(input())
      repetir(t, v)
    tests:
      - {stdin: "hola\n2\n", expected_stdout: "hola\nhola\n", visible: true}
      - {stdin: "x\n3\n", expected_stdout: "x\nx\nx\n", visible: false}
      - {stdin: "ok\n0\n", expected_stdout: "", visible: false}
    static_checks:
      - {kind: requires_function, name: repetir}
    wrong_examples:
      - code: |
          def repetir(texto, veces):
              print(texto * veces)

          t = input()
          v = int(input())
          repetir(t, v)
        expect_fail_tag: output.mismatch
      - code: |
          def repetir(texto, veces):
              for i in range(veces):
                  print(texto)

          t = input()
          v = int(input())
          repetir(v, t)
        expect_fail_tag: function.argument_order
    hints:
      - {es: 'Un bucle `for` dentro de la función repite el `print`.', en: 'A `for` loop inside the function repeats the `print`.'}
    explanation:
      es: 'Pasar los argumentos en otro orden asigna cada valor al parámetro equivocado.'
      en: 'Passing the arguments in another order assigns each value to the wrong parameter.'

  - id: py.u06.l02.e09
    type: write_code
    difficulty: 3
    skills: [py.params, py.def, py.for, py.input]
    prompt:
      es: |
        Define `mostrar_tabla(n)` que muestre la tabla de multiplicar de `n` del 1 al 5, con el formato
        `n x i = resultado`. Lee `n` (entero) y llama a la función.
      en: |
        Define `mostrar_tabla(n)` that shows the multiplication table of `n` from 1 to 5, in the format
        `n x i = result`. Read `n` (whole number) and call the function.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      def mostrar_tabla(n):
          for i in range(1, 6):
              print(n, "x", i, "=", n * i)

      mostrar_tabla(int(input()))
    tests:
      - {stdin: "3\n", expected_stdout: "3 x 1 = 3\n3 x 2 = 6\n3 x 3 = 9\n3 x 4 = 12\n3 x 5 = 15\n", visible: true}
      - {stdin: "7\n", expected_stdout: "7 x 1 = 7\n7 x 2 = 14\n7 x 3 = 21\n7 x 4 = 28\n7 x 5 = 35\n", visible: false}
    static_checks:
      - {kind: requires_function, name: mostrar_tabla}
    wrong_examples:
      - code: |
          def mostrar_tabla(n):
              for i in range(1, 5):
                  print(n, "x", i, "=", n * i)

          mostrar_tabla(int(input()))
        expect_fail_tag: logic.off_by_one
    hints:
      - {es: 'El final de `range` no se incluye.', en: 'The end of `range` is not included.'}
    explanation:
      es: 'Para llegar al 5 el final del `range` debe ser 6.'
      en: 'To reach 5 the end of the `range` must be 6.'
