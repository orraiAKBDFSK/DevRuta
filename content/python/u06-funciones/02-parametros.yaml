title:
  es: 'Parámetros y argumentos'
  en: 'Parameters and arguments'
explanation:
  es: |
    Una función puede recibir datos mediante **parámetros**, que se escriben entre los paréntesis de `def`:

    ```python
    def saludar(nombre):
        print("Hola,", nombre)

    saludar("Ana")      # Hola, Ana
    saludar("Luis")     # Hola, Luis
    ```

    - `nombre` es el **parámetro** (el nombre dentro de la función).
    - `"Ana"` es el **argumento** (el valor que pasas al llamar).
    - Con varios parámetros, los argumentos se asignan **por orden**: `resta(10, 3)` no es lo mismo que `resta(3, 10)`.
    - Un parámetro puede tener un **valor por defecto**: `def saludar(nombre="amigo"):`. Si no pasas argumento, se usa ese valor.
  en: |
    A function can receive data through **parameters**, written between the parentheses of `def`:

    ```python
    def saludar(nombre):
        print("Hola,", nombre)

    saludar("Ana")      # Hola, Ana
    saludar("Luis")     # Hola, Luis
    ```

    - `nombre` is the **parameter** (the name inside the function).
    - `"Ana"` is the **argument** (the value you pass when calling).
    - With several parameters, arguments are assigned **in order**: `resta(10, 3)` is not the same as `resta(3, 10)`.
    - A parameter can have a **default value**: `def saludar(nombre="amigo"):`. If you pass no argument, that value is used.
exercises:
  - id: py.u06.l02.e01
    type: predict_output
    difficulty: 1
    skills: [py.params]
    prompt:
      es: '¿Qué muestra este programa?'
      en: 'What does this program show?'
    code: |
      def doble(x):
          print(x * 2)

      doble(5)
    answer: "10"
    hints:
      - {es: 'Dentro de la función, `x` vale lo que pasaste al llamarla.', en: 'Inside the function, `x` is whatever you passed when calling it.'}
    explanation:
      es: 'El argumento 5 se guarda en el parámetro `x`.'
      en: 'The argument 5 is stored in the parameter `x`.'

  - id: py.u06.l02.e02
    type: predict_output
    difficulty: 2
    skills: [py.params]
    prompt:
      es: '¿Qué muestra este programa?'
      en: 'What does this program show?'
    code: |
      def resta(a, b):
          print(a - b)

      resta(10, 3)
    answer: "7"
    hints:
      - {es: 'El primer argumento va a `a` y el segundo a `b`.', en: 'The first argument goes to `a` and the second to `b`.'}
    explanation:
      es: '`a` vale 10 y `b` vale 3, así que 10 - 3 = 7.'
      en: '`a` is 10 and `b` is 3, so 10 - 3 = 7.'

