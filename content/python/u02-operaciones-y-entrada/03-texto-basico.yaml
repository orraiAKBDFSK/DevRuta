title:
  es: 'Trabajar con texto'
  en: 'Working with text'
explanation:
  es: |
    Con el texto también se puede operar:

    ```python
    print("Hola" + "Mundo")   # HolaMundo   (unir)
    print("ab" * 3)           # ababab      (repetir)
    print(len("Python"))      # 6           (cantidad de caracteres)
    ```

    - `+` une texto con texto. **No** puede unir texto con un número: usa `str(...)`.
      `"Edad: " + str(20)` da `Edad: 20`.
    - `\n` dentro del texto es un salto de línea: `print("a\nb")` escribe `a` y `b` en líneas distintas.
  en: |
    You can also operate on text:

    ```python
    print("Hola" + "Mundo")   # HolaMundo   (join)
    print("ab" * 3)           # ababab      (repeat)
    print(len("Python"))      # 6           (number of characters)
    ```

    - `+` joins text with text. It **cannot** join text with a number: use `str(...)`.
      `"Edad: " + str(20)` gives `Edad: 20`.
    - `\n` inside text is a line break: `print("a\nb")` writes `a` and `b` on different lines.
exercises:
