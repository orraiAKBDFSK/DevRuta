  - id: py.u02.l03.e07
    type: write_code
    difficulty: 2
    skills: [py.strings.basic, py.input]
    prompt:
      es: 'Lee una palabra y muéstrala repetida 3 veces, sin espacios entre ellas.'
      en: 'Read a word and show it repeated 3 times, with no spaces between the copies.'
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      palabra = input()
      print(palabra * 3)
    tests:
      - {stdin: "ja\n", expected_stdout: "jajaja\n", visible: true}
      - {stdin: "ok\n", expected_stdout: "okokok\n", visible: false}
    wrong_examples:
      - code: |
          p = input()
          print(p, p, p)
        expect_fail_tag: output.mismatch
      - code: |
          p = input()
          print(p + 3)
        expect_fail_tag: type.str_plus_int
    hints:
      - {es: 'Multiplicar un texto lo repite.', en: 'Multiplying text repeats it.'}
    explanation:
      es: '`print(a, b, c)` separa con espacios; `texto * 3` no.'
      en: '`print(a, b, c)` separates with spaces; `text * 3` does not.'

  - id: py.u02.l03.e08
    type: write_code
    difficulty: 3
    skills: [py.strings.basic, py.input, py.types.basic]
    prompt:
      es: |
        Lee un nombre y muestra el nombre, dos puntos, un espacio y la cantidad de letras.
        Ejemplo: `Ana` → `Ana: 3`. Usa `+` y `str(...)`.
      en: |
        Read a name and show the name, a colon, a space and the number of letters.
        Example: `Ana` → `Ana: 3`. Use `+` and `str(...)`.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      nombre = input()
      print(nombre + ": " + str(len(nombre)))
    tests:
      - {stdin: "Ana\n", expected_stdout: "Ana: 3\n", visible: true}
      - {stdin: "Beatriz\n", expected_stdout: "Beatriz: 7\n", visible: false}
    wrong_examples:
      - code: |
          nombre = input()
          print(nombre + ": " + len(nombre))
        expect_fail_tag: type.str_plus_int
      - code: |
          nombre = input()
          print(nombre + ":" + str(len(nombre)))
        expect_fail_tag: output.mismatch
    hints:
      - {es: 'len() devuelve un número; conviértelo con str() para unirlo.', en: 'len() returns a number; convert it with str() to join it.'}
    explanation:
      es: 'Para unir con `+` ambos lados deben ser texto.'
      en: 'To join with `+` both sides must be text.'
