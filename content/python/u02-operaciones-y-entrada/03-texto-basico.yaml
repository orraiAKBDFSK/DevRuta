  - id: py.u02.l03.e04
    type: multiple_choice
    difficulty: 2
    skills: [py.strings.basic, py.types.basic]
    prompt:
      es: '¿Qué ocurre con `print("Edad: " + 20)`?'
      en: 'What happens with `print("Edad: " + 20)`?'
    options:
      - {es: 'Muestra Edad: 20.', en: 'It shows Edad: 20.'}
      - {es: 'Da un error porque no se puede unir texto con un número.', en: 'It fails because you cannot join text with a number.'}
      - {es: 'Muestra solo Edad:.', en: 'It shows only Edad:.'}
      - {es: 'Muestra solo 20.', en: 'It shows only 20.'}
    answer: 1
    distractor_tags: {0: type.str_plus_int}
    hints:
      - {es: 'Mira los tipos de cada lado del +.', en: 'Look at the types on each side of the +.'}
    explanation:
      es: 'Es un `TypeError`. Lo correcto es `"Edad: " + str(20)` o `print("Edad:", 20)`.'
      en: 'It is a `TypeError`. The right way is `"Edad: " + str(20)` or `print("Edad:", 20)`.'

