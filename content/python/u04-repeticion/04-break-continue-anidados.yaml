  - id: py.u04.l04.e06
    type: write_code
    difficulty: 3
    skills: [py.while, py.input]
    prompt:
      es: |
        Lee números enteros (uno por línea). Cuando llegue un número negativo, detén la lectura
        y muestra cuántos números no negativos se leyeron antes. Usa `while True` y `break`.
      en: |
        Read whole numbers (one per line). When a negative number arrives, stop reading
        and show how many non-negative numbers were read before it. Use `while True` and `break`.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      cuenta = 0
      while True:
          n = int(input())
          if n < 0:
              break
          cuenta = cuenta + 1
      print(cuenta)
    tests:
      - {stdin: "5\n3\n-1\n", expected_stdout: "2\n", visible: true}
      - {stdin: "-4\n", expected_stdout: "0\n", visible: false}
      - {stdin: "1\n2\n3\n-1\n", expected_stdout: "3\n", visible: false}
    wrong_examples:
      - code: |
          cuenta = 0
          while True:
              n = int(input())
              cuenta = cuenta + 1
              if n < 0:
                  break
          print(cuenta)
        expect_fail_tag: logic.count_before_check
    hints:
      - {es: 'Comprueba si es negativo antes de contar.', en: 'Check whether it is negative before counting.'}
    explanation:
      es: 'Si cuentas antes de comprobar, el número negativo también se cuenta.'
      en: 'If you count before checking, the negative number is counted too.'

  - id: py.u04.l04.e07
    type: write_code
    difficulty: 3
    skills: [py.for, py.range, py.input, py.strings.basic]
    prompt:
      es: |
        Lee un entero `n` y dibuja un triángulo de asteriscos de `n` filas: la fila 1 tiene un `*`,
        la fila 2 tiene dos, y así hasta `n`. Ejemplo para 3: `*`, `**`, `***`.
      en: |
        Read a whole number `n` and draw a triangle of asterisks with `n` rows: row 1 has one `*`,
        row 2 has two, and so on up to `n`. Example for 3: `*`, `**`, `***`.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      n = int(input())
      for i in range(1, n + 1):
          print("*" * i)
    tests:
      - {stdin: "3\n", expected_stdout: "*\n**\n***\n", visible: true}
      - {stdin: "1\n", expected_stdout: "*\n", visible: false}
      - {stdin: "4\n", expected_stdout: "*\n**\n***\n****\n", visible: false}
    wrong_examples:
      - code: |
          n = int(input())
          for i in range(n):
              print("*" * n)
        expect_fail_tag: logic.wrong_pattern
    hints:
      - {es: 'La cantidad de asteriscos de cada fila es el valor de `i`.', en: 'The number of asterisks in each row is the value of `i`.'}
    explanation:
      es: 'Repetir texto con `*` evita escribir un segundo bucle.'
      en: 'Repeating text with `*` avoids writing a second loop.'

  - id: py.u04.l04.e08
    type: write_code
    difficulty: 4
    skills: [py.for, py.if, py.operators, py.input]
    prompt:
      es: |
        Lee un entero `n` (2 o mayor). Muestra `primo` si solo es divisible entre 1 y entre sí mismo,
        o `no primo` en caso contrario. Usa un bucle con `break`.
      en: |
        Read a whole number `n` (2 or greater). Show `primo` if it is only divisible by 1 and itself,
        or `no primo` otherwise. Use a loop with `break`.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      n = int(input())
      es_primo = True
      for d in range(2, n):
          if n % d == 0:
              es_primo = False
              break
      if es_primo:
          print("primo")
      else:
          print("no primo")
    tests:
      - {stdin: "7\n", expected_stdout: "primo\n", visible: true}
      - {stdin: "9\n", expected_stdout: "no primo\n", visible: false}
      - {stdin: "2\n", expected_stdout: "primo\n", visible: false}
      - {stdin: "15\n", expected_stdout: "no primo\n", visible: false}
      - {stdin: "13\n", expected_stdout: "primo\n", visible: false}
    wrong_examples:
      - code: |
          n = int(input())
          es_primo = True
          for d in range(2, n + 1):
              if n % d == 0:
                  es_primo = False
                  break
          if es_primo:
              print("primo")
          else:
              print("no primo")
        expect_fail_tag: logic.off_by_one
      - code: |
          n = int(input())
          es_primo = True
          for d in range(1, n):
              if n % d == 0:
                  es_primo = False
                  break
          if es_primo:
              print("primo")
          else:
              print("no primo")
        expect_fail_tag: logic.wrong_range_start
    hints:
      - {es: 'Prueba los divisores desde 2 hasta `n - 1`.', en: 'Try the divisors from 2 to `n - 1`.'}
      - {es: 'Usa una variable `bool` que cambie a `False` si encuentras un divisor.', en: 'Use a `bool` variable that turns `False` if you find a divisor.'}
    explanation:
      es: 'Todo número es divisible entre 1 y entre sí mismo, por eso esos dos no se prueban.'
      en: 'Every number is divisible by 1 and by itself, which is why those two are not tested.'
