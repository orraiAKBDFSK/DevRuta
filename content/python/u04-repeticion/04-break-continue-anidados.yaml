title:
  es: 'break, continue y bucles anidados'
  en: 'break, continue and nested loops'
explanation:
  es: |
    Dos instrucciones para controlar un bucle desde dentro:

    - `break` **termina** el bucle de inmediato.
    - `continue` **salta** el resto de la vuelta actual y pasa a la siguiente.

    ```python
    for i in range(5):
        if i == 2:
            continue      # salta el 2
        if i == 4:
            break         # se detiene antes de mostrar el 4
        print(i)          # 0, 1, 3
    ```

    Un bucle puede contener a otro (**anidado**). El de dentro se repite completo en cada vuelta del de fuera:

    ```python
    for i in range(2):
        for j in range(3):
            print(i, j)   # 6 líneas en total
    ```

    `while True:` crea un bucle que solo termina con `break`.
  en: |
    Two instructions to control a loop from the inside:

    - `break` **ends** the loop immediately.
    - `continue` **skips** the rest of the current turn and moves to the next one.

    ```python
    for i in range(5):
        if i == 2:
            continue      # skips 2
        if i == 4:
            break         # stops before showing 4
        print(i)          # 0, 1, 3
    ```

    A loop can contain another one (**nested**). The inner one runs completely on every turn of the outer one:

    ```python
    for i in range(2):
        for j in range(3):
            print(i, j)   # 6 lines in total
    ```

    `while True:` creates a loop that only ends with `break`.
exercises:
  - id: py.u04.l04.e01
    type: predict_output
    difficulty: 2
    skills: [py.for]
    prompt:
      es: '¿Qué muestra este programa?'
      en: 'What does this program show?'
    code: |
      for i in range(10):
          if i == 3:
              break
          print(i)
    answer: "0\n1\n2"
    hints:
      - {es: 'Cuando `i` vale 3, el bucle termina.', en: 'When `i` is 3, the loop ends.'}
    explanation:
      es: '`break` sale del bucle antes de mostrar el 3.'
      en: '`break` leaves the loop before showing 3.'

