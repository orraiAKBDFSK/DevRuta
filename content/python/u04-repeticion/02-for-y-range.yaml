title:
  es: 'Repetir con for y range'
  en: 'Repeating with for and range'
explanation:
  es: |
    Cuando sabes **cuántas veces** repetir, `for` es más cómodo que `while`:

    ```python
    for i in range(3):
        print(i)
    ```

    Muestra `0`, `1` y `2`.

    - `range(n)` genera los números desde **0 hasta n - 1** (n valores).
    - `range(a, b)` genera desde `a` hasta `b - 1`: `range(1, 4)` da `1, 2, 3`.
    - El final **nunca se incluye**.
    - `for` también recorre textos letra por letra: `for letra in "hola":`.
  en: |
    When you know **how many times** to repeat, `for` is more convenient than `while`:

    ```python
    for i in range(3):
        print(i)
    ```

    It shows `0`, `1` and `2`.

    - `range(n)` generates the numbers from **0 to n - 1** (n values).
    - `range(a, b)` generates from `a` up to `b - 1`: `range(1, 4)` gives `1, 2, 3`.
    - The end is **never included**.
    - `for` also walks through text letter by letter: `for letra in "hola":`.
exercises:
  - id: py.u04.l02.e01
    type: predict_output
    difficulty: 1
    skills: [py.for, py.range]
    prompt:
      es: '¿Qué muestra este programa?'
      en: 'What does this program show?'
    code: |
      for i in range(3):
          print(i)
    answer: "0\n1\n2"
    hints:
      - {es: '`range(3)` empieza en 0.', en: '`range(3)` starts at 0.'}
    explanation:
      es: 'Son 3 vueltas con los valores 0, 1 y 2.'
      en: 'There are 3 turns with the values 0, 1 and 2.'

  - id: py.u04.l02.e02
    type: predict_output
    difficulty: 1
    skills: [py.for]
    prompt:
