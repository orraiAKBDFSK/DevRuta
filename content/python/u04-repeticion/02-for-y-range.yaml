    reference_solution: |
      palabra = input()
      for letra in palabra:
          print(letra)
    tests:
      - {stdin: "sol\n", expected_stdout: "s\no\nl\n", visible: true}
      - {stdin: "a\n", expected_stdout: "a\n", visible: false}
      - {stdin: "python\n", expected_stdout: "p\ny\nt\nh\no\nn\n", visible: false}
    wrong_examples:
      - code: |
          palabra = input()
          print(palabra)
        expect_fail_tag: output.mismatch
    hints:
      - {es: 'No necesitas `range`; recorre la propia palabra.', en: 'You do not need `range`; walk through the word itself.'}
    explanation:
      es: '`for letra in palabra` toma un carácter por vuelta.'
      en: '`for letra in palabra` takes one character per turn.'
