  - id: py.u04.l02.e06
    type: predict_output
    difficulty: 3
    skills: [py.for, py.range, py.operators]
    prompt:
      es: '¿Qué muestra este programa?'
      en: 'What does this program show?'
    code: |
      total = 0
      for i in range(1, 5):
          total = total + i
      print(total)
    answer: "10"
    hints:
      - {es: 'Suma los valores 1, 2, 3 y 4.', en: 'Add the values 1, 2, 3 and 4.'}
    explanation:
      es: '1 + 2 + 3 + 4 = 10. El 5 no entra en `range(1, 5)`.'
      en: '1 + 2 + 3 + 4 = 10. The 5 is not part of `range(1, 5)`.'

  - id: py.u04.l02.e07
    type: write_code
    difficulty: 2
    skills: [py.for, py.range, py.input]
    prompt:
      es: 'Lee un entero `n` y muestra la palabra `hola` exactamente `n` veces, una por línea.'
      en: 'Read a whole number `n` and show the word `hola` exactly `n` times, one per line.'
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      n = int(input())
      for i in range(n):
          print("hola")
    tests:
      - {stdin: "3\n", expected_stdout: "hola\nhola\nhola\n", visible: true}
      - {stdin: "1\n", expected_stdout: "hola\n", visible: false}
      - {stdin: "0\n", expected_stdout: "", visible: false}
    wrong_examples:
      - code: |
          n = int(input())
          for i in range(n + 1):
              print("hola")
        expect_fail_tag: logic.off_by_one
      - code: |
          n = int(input())
          print("hola" * n)
        expect_fail_tag: output.mismatch
    hints:
      - {es: 'El `range` decide cuántas vueltas.', en: 'The `range` decides how many turns.'}
    explanation:
      es: '`range(n)` repite exactamente `n` veces, incluso cero.'
      en: '`range(n)` repeats exactly `n` times, even zero.'

  - id: py.u04.l02.e08
    type: write_code
    difficulty: 3
    skills: [py.for, py.range, py.input, py.operators]
    prompt:
      es: 'Lee un entero `n` y muestra la suma de los números del 1 al `n`. Esta vez usa `for`.'
      en: 'Read a whole number `n` and show the sum of the numbers from 1 to `n`. This time use `for`.'
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      n = int(input())
      total = 0
      for i in range(1, n + 1):
          total = total + i
      print(total)
    tests:
      - {stdin: "4\n", expected_stdout: "10\n", visible: true}
      - {stdin: "10\n", expected_stdout: "55\n", visible: false}
      - {stdin: "1\n", expected_stdout: "1\n", visible: false}
    wrong_examples:
      - code: |
          n = int(input())
          total = 0
          for i in range(1, n):
              total = total + i
          print(total)
        expect_fail_tag: logic.off_by_one
      - code: |
          n = int(input())
          total = 0
          for i in range(n):
              total = total + i
          print(total)
        expect_fail_tag: logic.off_by_one
    hints:
      - {es: 'Para incluir a `n` el final del `range` debe ser `n + 1`.', en: 'To include `n` the end of the `range` must be `n + 1`.'}
    explanation:
      es: 'El final de `range` no se incluye, por eso se escribe `n + 1`.'
      en: 'The end of `range` is not included, which is why you write `n + 1`.'

  - id: py.u04.l02.e09
