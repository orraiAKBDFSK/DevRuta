  - id: py.u04.l03.e06
    type: write_code
    difficulty: 3
    skills: [py.range, py.for, py.input]
    prompt:
      es: 'Lee un entero `n` y muestra los números pares desde el 2 hasta `n` (incluido si es par), uno por línea.'
      en: 'Read a whole number `n` and show the even numbers from 2 up to `n` (included if even), one per line.'
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      n = int(input())
      for i in range(2, n + 1, 2):
          print(i)
    tests:
      - {stdin: "6\n", expected_stdout: "2\n4\n6\n", visible: true}
      - {stdin: "7\n", expected_stdout: "2\n4\n6\n", visible: false}
      - {stdin: "1\n", expected_stdout: "", visible: false}
    wrong_examples:
      - code: |
          n = int(input())
          for i in range(2, n, 2):
              print(i)
        expect_fail_tag: logic.off_by_one
      - code: |
          n = int(input())
          for i in range(1, n + 1):
              print(i)
        expect_fail_tag: logic.missing_step
    hints:
      - {es: 'Usa un paso de 2 empezando en 2.', en: 'Use a step of 2 starting at 2.'}
    explanation:
      es: 'Con `n + 1` como final, el propio `n` entra si es par.'
      en: 'With `n + 1` as the end, `n` itself is included if it is even.'

  - id: py.u04.l03.e07
    type: write_code
    difficulty: 3
    skills: [py.for, py.if, py.operators, py.input]
    prompt:
      es: 'Lee un entero `n` y muestra cuántos múltiplos de 3 hay entre 1 y `n` (ambos incluidos).'
      en: 'Read a whole number `n` and show how many multiples of 3 there are between 1 and `n` (both included).'
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      n = int(input())
      cuenta = 0
      for i in range(1, n + 1):
          if i % 3 == 0:
              cuenta = cuenta + 1
      print(cuenta)
    tests:
      - {stdin: "10\n", expected_stdout: "3\n", visible: true}
      - {stdin: "9\n", expected_stdout: "3\n", visible: false}
      - {stdin: "2\n", expected_stdout: "0\n", visible: false}
    wrong_examples:
      - code: |
          n = int(input())
          cuenta = 0
          for i in range(1, n):
              if i % 3 == 0:
                  cuenta = cuenta + 1
          print(cuenta)
        expect_fail_tag: logic.off_by_one
      - code: |
          n = int(input())
          for i in range(1, n + 1):
              if i % 3 == 0:
                  print(i)
        expect_fail_tag: logic.print_instead_of_count
    hints:
      - {es: 'Crea un contador en 0 antes del bucle.', en: 'Create a counter at 0 before the loop.'}
      - {es: 'Súmale 1 solo cuando `i % 3 == 0`.', en: 'Add 1 only when `i % 3 == 0`.'}
    explanation:
      es: 'Un contador combina un bucle, un `if` y una variable que empieza en 0.'
      en: 'A counter combines a loop, an `if` and a variable that starts at 0.'

  - id: py.u04.l03.e08
    type: write_code
    difficulty: 3
    skills: [py.for, py.range, py.input, py.operators]
    prompt:
      es: |
        Lee un entero `n` y muestra su tabla de multiplicar del 1 al 10, con el formato `n x i = resultado`.
        Ejemplo para 2: `2 x 1 = 2`.
      en: |
        Read a whole number `n` and show its multiplication table from 1 to 10, in the format `n x i = result`.
        Example for 2: `2 x 1 = 2`.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      n = int(input())
      for i in range(1, 11):
          print(n, "x", i, "=", n * i)
    tests:
      - {stdin: "2\n", expected_stdout: "2 x 1 = 2\n2 x 2 = 4\n2 x 3 = 6\n2 x 4 = 8\n2 x 5 = 10\n2 x 6 = 12\n2 x 7 = 14\n2 x 8 = 16\n2 x 9 = 18\n2 x 10 = 20\n", visible: true}
      - {stdin: "5\n", expected_stdout: "5 x 1 = 5\n5 x 2 = 10\n5 x 3 = 15\n5 x 4 = 20\n5 x 5 = 25\n5 x 6 = 30\n5 x 7 = 35\n5 x 8 = 40\n5 x 9 = 45\n5 x 10 = 50\n", visible: false}
    wrong_examples:
      - code: |
          n = int(input())
          for i in range(1, 10):
              print(n, "x", i, "=", n * i)
        expect_fail_tag: logic.off_by_one
      - code: |
          n = int(input())
          for i in range(1, 11):
              print(n, "x", i, "=", n + i)
        expect_fail_tag: logic.wrong_operation
    hints:
      - {es: '`print(a, b, c)` separa los valores con un espacio.', en: '`print(a, b, c)` separates the values with a space.'}
    explanation:
      es: 'El 10 debe entrar, así que el final del `range` es 11.'
      en: 'The 10 must be included, so the end of the `range` is 11.'

  - id: py.u04.l03.e09
    type: write_code
    difficulty: 4
    skills: [py.for, py.range, py.operators, py.input]
    prompt:
      es: 'Lee un entero `n` (0 o mayor) y muestra su factorial: el producto de todos los enteros de 1 a `n`. El factorial de 0 es 1.'
      en: 'Read a whole number `n` (0 or greater) and show its factorial: the product of all whole numbers from 1 to `n`. The factorial of 0 is 1.'
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      n = int(input())
      resultado = 1
      for i in range(1, n + 1):
          resultado = resultado * i
      print(resultado)
    tests:
      - {stdin: "5\n", expected_stdout: "120\n", visible: true}
      - {stdin: "0\n", expected_stdout: "1\n", visible: false}
      - {stdin: "1\n", expected_stdout: "1\n", visible: false}
      - {stdin: "10\n", expected_stdout: "3628800\n", visible: false}
    wrong_examples:
      - code: |
          n = int(input())
          resultado = 0
          for i in range(1, n + 1):
              resultado = resultado * i
          print(resultado)
        expect_fail_tag: logic.bad_initial_value
      - code: |
          n = int(input())
          resultado = 1
          for i in range(1, n):
              resultado = resultado * i
          print(resultado)
        expect_fail_tag: logic.off_by_one
    hints:
      - {es: 'Un acumulador que multiplica debe empezar en 1, no en 0.', en: 'An accumulator that multiplies must start at 1, not 0.'}
    explanation:
      es: 'Empezar en 0 haría que todo producto fuera 0.'
      en: 'Starting at 0 would make every product 0.'
