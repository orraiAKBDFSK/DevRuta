title:
  es: 'Pasos, contadores y acumuladores'
  en: 'Steps, counters and accumulators'
explanation:
  es: |
    `range` acepta un tercer valor, el **paso**: `range(inicio, fin, paso)`.

    ```python
    for i in range(0, 10, 3):    # 0, 3, 6, 9
        print(i)
    for i in range(5, 0, -1):    # 5, 4, 3, 2, 1
        print(i)
    ```

    Dos patrones muy usados dentro de un bucle:

    - **Acumulador**: `total = total + i` suma o junta valores.
    - **Contador**: `if condicion: cuenta = cuenta + 1` cuenta cuántas veces algo se cumple.
  en: |
    `range` accepts a third value, the **step**: `range(start, end, step)`.

    ```python
    for i in range(0, 10, 3):    # 0, 3, 6, 9
        print(i)
    for i in range(5, 0, -1):    # 5, 4, 3, 2, 1
        print(i)
    ```

    Two very common patterns inside a loop:

    - **Accumulator**: `total = total + i` adds up or collects values.
    - **Counter**: `if condition: count = count + 1` counts how many times something holds.
exercises:
  - id: py.u04.l03.e01
    type: predict_output
    difficulty: 2
    skills: [py.range]
    prompt:
      es: '¿Qué muestra este programa?'
      en: 'What does this program show?'
    code: |
      for i in range(0, 10, 3):
          print(i)
    answer: "0\n3\n6\n9"
    hints:
      - {es: 'Cada vuelta suma 3 al valor anterior.', en: 'Each turn adds 3 to the previous value.'}
    explanation:
      es: 'El siguiente sería 12, que ya supera el final (10).'
      en: 'The next one would be 12, which already exceeds the end (10).'

  - id: py.u04.l03.e02
    type: predict_output
    difficulty: 2
    skills: [py.range]
    prompt:
      es: '¿Qué muestra este programa?'
      en: 'What does this program show?'
    code: |
      for i in range(5, 0, -1):
          print(i)
    answer: "5\n4\n3\n2\n1"
    hints:
      - {es: 'Un paso negativo cuenta hacia atrás.', en: 'A negative step counts backwards.'}
    explanation:
      es: 'El final (0) no se incluye, igual que en los otros `range`.'
      en: 'The end (0) is not included, just like in other `range` calls.'

  - id: py.u04.l03.e03
    type: predict_output
    difficulty: 3
    skills: [py.for, py.if, py.operators]
    prompt:
      es: '¿Qué muestra este programa?'
      en: 'What does this program show?'
    code: |
      cuenta = 0
      for i in range(10):
          if i % 2 == 0:
              cuenta = cuenta + 1
      print(cuenta)
    answer: "5"
    hints:
      - {es: 'Cuenta los números pares entre 0 y 9.', en: 'Count the even numbers between 0 and 9.'}
    explanation:
      es: 'Los pares son 0, 2, 4, 6 y 8: cinco en total.'
      en: 'The even numbers are 0, 2, 4, 6 and 8: five in total.'

  - id: py.u04.l03.e04
    type: multiple_choice
    difficulty: 3
    skills: [py.range]
    prompt:
      es: '¿Qué `range` recorre los números pares del 2 al 10, ambos incluidos?'
      en: 'Which `range` walks through the even numbers from 2 to 10, both included?'
    options:
      - {es: 'range(2, 11, 2)', en: 'range(2, 11, 2)'}
      - {es: 'range(2, 10, 2)', en: 'range(2, 10, 2)'}
      - {es: 'range(10, 2, 2)', en: 'range(10, 2, 2)'}
      - {es: 'range(2, 11)', en: 'range(2, 11)'}
    answer: 0
    distractor_tags: {1: logic.off_by_one, 2: logic.wrong_direction, 3: logic.missing_step}
    hints:
      - {es: 'El final no se incluye, así que debe ser mayor que 10.', en: 'The end is not included, so it must be greater than 10.'}
    explanation:
      es: '`range(2, 10, 2)` se detendría en 8; `range(2, 11)` incluiría también los impares.'
      en: '`range(2, 10, 2)` would stop at 8; `range(2, 11)` would include the odd numbers too.'

  - id: py.u04.l03.e05
    type: fill_code
    difficulty: 3
    skills: [py.range]
    prompt:
      es: 'Completa el `range` para que el programa cuente de 10 a 1.'
      en: 'Fill in the `range` so the program counts from 10 to 1.'
