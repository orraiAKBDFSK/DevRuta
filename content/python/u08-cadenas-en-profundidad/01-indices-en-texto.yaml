      en: 'The outer single quotes let you write double quotes inside the text.'

  - id: py.u08.l01.e08
    type: write_code
    difficulty: 2
    skills: [py.slicing, py.input]
    prompt:
      es: 'Lee una palabra y muestra su primera y su última letra, separadas por un espacio.'
      en: 'Read a word and show its first and its last letter, separated by a space.'
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      palabra = input()
      print(palabra[0], palabra[-1])
    tests:
      - {stdin: "hola\n", expected_stdout: "h a\n", visible: true}
      - {stdin: "x\n", expected_stdout: "x x\n", visible: false}
      - {stdin: "python\n", expected_stdout: "p n\n", visible: false}
    wrong_examples:
      - code: |
          palabra = input()
          print(palabra[0], palabra[len(palabra)])
        expect_fail_tag: index.out_of_range
      - code: |
          palabra = input()
          print(palabra[-1], palabra[0])
        expect_fail_tag: logic.swapped_order
    hints:
      - {es: 'Para la última letra no necesitas calcular la longitud.', en: 'For the last letter you do not need to calculate the length.'}
    explanation:
      es: '`palabra[len(palabra)]` se pasa del último índice, que es `len(palabra) - 1`.'
      en: '`palabra[len(palabra)]` goes past the last index, which is `len(palabra) - 1`.'

  - id: py.u08.l01.e09
    type: write_code
    difficulty: 3
    skills: [py.slicing, py.for, py.input]
    prompt:
      es: 'Lee una palabra y muestra cada letra con su índice, una por línea, en el formato `0 a`.'
      en: 'Read a word and show each letter with its index, one per line, in the format `0 a`.'
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      palabra = input()
      for i in range(len(palabra)):
          print(i, palabra[i])
    tests:
      - {stdin: "abc\n", expected_stdout: "0 a\n1 b\n2 c\n", visible: true}
      - {stdin: "z\n", expected_stdout: "0 z\n", visible: false}
    wrong_examples:
      - code: |
          palabra = input()
          for i in range(1, len(palabra) + 1):
              print(i, palabra[i - 1])
        expect_fail_tag: logic.off_by_one
    hints:
      - {es: 'Recorre los índices con `range(len(palabra))`.', en: 'Walk through the indexes with `range(len(palabra))`.'}
    explanation:
      es: 'Los índices empiezan en 0, no en 1.'
      en: 'Indexes start at 0, not 1.'

  - id: py.u08.l01.e10
    type: write_code
    difficulty: 3
    skills: [py.slicing, py.compare, py.input]
    prompt:
      es: 'Lee una palabra y muestra `True` si empieza y termina con la misma letra, o `False` si no.'
      en: 'Read a word and show `True` if it starts and ends with the same letter, or `False` otherwise.'
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      palabra = input()
      print(palabra[0] == palabra[-1])
    tests:
      - {stdin: "oso\n", expected_stdout: "True\n", visible: true}
      - {stdin: "casa\n", expected_stdout: "False\n", visible: false}
      - {stdin: "a\n", expected_stdout: "True\n", visible: false}
    wrong_examples:
      - code: |
          palabra = input()
          print(palabra[0] != palabra[-1])
        expect_fail_tag: logic.inverted_condition
    hints:
      - {es: 'Compara el primer y el último carácter con `==`.', en: 'Compare the first and the last character with `==`.'}
    explanation:
      es: 'Con una sola letra, la primera y la última son la misma.'
      en: 'With a single letter, the first and the last are the same.'
