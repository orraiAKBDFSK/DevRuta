title:
  es: 'Formatear texto con f-strings'
  en: 'Formatting text with f-strings'
explanation:
  es: |
    Una **f-string** es un texto con una `f` delante, que permite insertar valores con llaves `{}`:

    ```python
    nombre = "Ana"
    edad = 20
    print(f"Nombre: {nombre}, Edad: {edad}")   # Nombre: Ana, Edad: 20
    print(f"Dentro de un año: {edad + 1}")      # se pueden calcular expresiones
    ```

    También se puede dar **formato** a lo que se inserta, después de dos puntos:

    ```python
    pi = 3.14159
    print(f"{pi:.2f}")        # 3.14   (2 decimales)
    print(f"[{'ab':>5}]")     # [   ab] (alineado a la derecha en 5 espacios)
    ```

    Sin la `f`, las llaves se muestran tal cual: `print("{nombre}")` escribe `{nombre}`.
  en: |
    An **f-string** is a text with an `f` in front, which lets you insert values with braces `{}`:

    ```python
    nombre = "Ana"
    edad = 20
    print(f"Nombre: {nombre}, Edad: {edad}")   # Nombre: Ana, Edad: 20
    print(f"Dentro de un año: {edad + 1}")      # expressions can be calculated
    ```

    You can also **format** what is inserted, after a colon:

    ```python
    pi = 3.14159
    print(f"{pi:.2f}")        # 3.14   (2 decimals)
    print(f"[{'ab':>5}]")     # [   ab] (right-aligned in 5 spaces)
    ```

    Without the `f`, the braces are shown as they are: `print("{nombre}")` writes `{nombre}`.
