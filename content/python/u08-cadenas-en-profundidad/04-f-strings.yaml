  - id: py.u08.l04.e08
    type: write_code
    difficulty: 2
    skills: [py.fstring, py.input]
    prompt:
      es: |
        Lee un nombre y una edad (entero), uno por línea. Muestra `Nombre: X, Edad: Y` usando una f-string.
      en: |
        Read a name and an age (whole number), one per line. Show `Nombre: X, Edad: Y` using an f-string.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      nombre = input()
      edad = int(input())
      print(f"Nombre: {nombre}, Edad: {edad}")
    tests:
      - {stdin: "Ana\n20\n", expected_stdout: "Nombre: Ana, Edad: 20\n", visible: true}
      - {stdin: "Luis\n9\n", expected_stdout: "Nombre: Luis, Edad: 9\n", visible: false}
    wrong_examples:
      - code: |
          nombre = input()
          edad = int(input())
          print("Nombre:", nombre, "Edad:", edad)
        expect_fail_tag: output.mismatch
    hints:
      - {es: 'Respeta exactamente la coma y los espacios del formato.', en: 'Follow the comma and the spaces of the format exactly.'}
    explanation:
      es: 'Con comas en `print` se pierde la coma del formato y se añaden espacios distintos.'
      en: 'With commas in `print` the comma of the format is lost and different spaces are added.'

  - id: py.u08.l04.e09
    type: write_code
    difficulty: 3
    skills: [py.fstring, py.operators, py.input]
    prompt:
      es: |
        Lee un precio (puede tener decimales) y una cantidad (entero), uno por línea.
        Muestra el total con exactamente dos decimales.
      en: |
        Read a price (it may have decimals) and a quantity (whole number), one per line.
        Show the total with exactly two decimals.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      precio = float(input())
      cantidad = int(input())
      print(f"{precio * cantidad:.2f}")
    tests:
      - {stdin: "2.5\n4\n", expected_stdout: "10.00\n", visible: true}
      - {stdin: "1.1\n3\n", expected_stdout: "3.30\n", visible: false}
      - {stdin: "10\n1\n", expected_stdout: "10.00\n", visible: false}
    wrong_examples:
      - code: |
          precio = float(input())
          cantidad = int(input())
          print(precio * cantidad)
        expect_fail_tag: fstring.missing_format
    hints:
      - {es: 'Dentro de las llaves puedes calcular y dar formato: `{a * b:.2f}`.', en: 'Inside the braces you can calculate and format: `{a * b:.2f}`.'}
    explanation:
      es: 'Sin formato, 10.0 y 3.3000000000000003 se mostrarían tal cual.'
      en: 'Without formatting, 10.0 and 3.3000000000000003 would be shown as they are.'

  - id: py.u08.l04.e10
    type: write_code
    difficulty: 3
    skills: [py.fstring, py.for, py.dict, py.input]
    prompt:
      es: |
        Lee un entero `n` y luego `n` pares de líneas: un producto y su precio (entero). Muestra cada línea como
        `producto: precio` y, al final, `Total: suma`.
      en: |
        Read a whole number `n` and then `n` pairs of lines: a product and its price (whole number). Show each line as
        `producto: precio` and, at the end, `Total: suma`.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      n = int(input())
      total = 0
      for i in range(n):
          producto = input()
          precio = int(input())
          print(f"{producto}: {precio}")
          total = total + precio
      print(f"Total: {total}")
    tests:
      - {stdin: "2\npan\n3\nleche\n5\n", expected_stdout: "pan: 3\nleche: 5\nTotal: 8\n", visible: true}
      - {stdin: "1\nx\n7\n", expected_stdout: "x: 7\nTotal: 7\n", visible: false}
      - {stdin: "0\n", expected_stdout: "Total: 0\n", visible: false}
    wrong_examples:
      - code: |
          n = int(input())
          total = 0
          for i in range(n):
              producto = input()
              precio = int(input())
              print(f"{producto}: {precio}")
              total = total + precio
          print(total)
        expect_fail_tag: output.mismatch
    hints:
      - {es: 'Muestra cada línea dentro del bucle y el total después.', en: 'Show each line inside the loop and the total after it.'}
    explanation:
      es: 'El total lleva su propia etiqueta.'
      en: 'The total has its own label.'

  - id: py.u08.l04.e11
    type: write_code
    difficulty: 4
    skills: [py.fstring, py.strings.basic, py.input]
    prompt:
      es: |
        Lee un entero `n` entre 0 y 10. Muestra una barra de progreso de 10 posiciones con `#` para las llenas y `.` para
        las vacías, entre corchetes, seguida del porcentaje. Ejemplo para 3: `[###.......] 30%`.
      en: |
        Read a whole number `n` between 0 and 10. Show a 10-position progress bar with `#` for the filled ones and `.` for
        the empty ones, between square brackets, followed by the percentage. Example for 3: `[###.......] 30%`.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      n = int(input())
      llenos = "#" * n
      vacios = "." * (10 - n)
      print(f"[{llenos}{vacios}] {n * 10}%")
    tests:
      - {stdin: "3\n", expected_stdout: "[###.......] 30%\n", visible: true}
      - {stdin: "0\n", expected_stdout: "[..........] 0%\n", visible: false}
      - {stdin: "10\n", expected_stdout: "[##########] 100%\n", visible: false}
    wrong_examples:
      - code: |
          n = int(input())
          llenos = "#" * n
          vacios = "." * n
          print(f"[{llenos}{vacios}] {n * 10}%")
        expect_fail_tag: logic.wrong_operation
    hints:
      - {es: 'La cantidad de vacíos es lo que falta para llegar a 10.', en: 'The number of empty ones is what is missing to reach 10.'}
    explanation:
      es: 'Repetir texto con `*` y combinarlo con una f-string evita bucles.'
      en: 'Repeating text with `*` and combining it with an f-string avoids loops.'
