  - id: py.u08.l02.e10
    type: write_code
    difficulty: 2
    skills: [py.slicing, py.input]
    prompt:
      es: 'Lee una palabra y muestra sus tres primeras letras (o la palabra completa si tiene menos de tres).'
      en: 'Read a word and show its first three letters (or the whole word if it has fewer than three).'
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      palabra = input()
      print(palabra[:3])
    tests:
      - {stdin: "python\n", expected_stdout: "pyt\n", visible: true}
      - {stdin: "ab\n", expected_stdout: "ab\n", visible: false}
      - {stdin: "sol\n", expected_stdout: "sol\n", visible: false}
    wrong_examples:
      - code: |
          palabra = input()
          print(palabra[0] + palabra[1] + palabra[2])
        expect_fail_tag: index.out_of_range
      - code: |
          palabra = input()
          print(palabra[:2])
        expect_fail_tag: logic.off_by_one
    hints:
      - {es: 'Una rebanada no falla aunque el texto sea corto.', en: 'A slice does not fail even if the text is short.'}
    explanation:
      es: 'Indexar con `[2]` fallaría con textos de menos de 3 letras; la rebanada no.'
      en: 'Indexing with `[2]` would fail for texts shorter than 3 letters; the slice does not.'

  - id: py.u08.l02.e11
    type: write_code
    difficulty: 3
    skills: [py.slicing, py.compare, py.input]
    prompt:
      es: 'Lee una palabra y muestra `True` si es un palíndromo (se lee igual al derecho y al revés), o `False` si no.'
      en: 'Read a word and show `True` if it is a palindrome (it reads the same forwards and backwards), or `False` otherwise.'
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      palabra = input()
      print(palabra == palabra[::-1])
    tests:
      - {stdin: "oso\n", expected_stdout: "True\n", visible: true}
      - {stdin: "casa\n", expected_stdout: "False\n", visible: false}
      - {stdin: "reconocer\n", expected_stdout: "True\n", visible: false}
      - {stdin: "a\n", expected_stdout: "True\n", visible: false}
    wrong_examples:
      - code: |
          palabra = input()
          print(palabra == palabra)
        expect_fail_tag: logic.tautology
    hints:
      - {es: 'Compara la palabra con la palabra invertida.', en: 'Compare the word with the reversed word.'}
    explanation:
      es: 'Un palíndromo es igual a sí mismo al invertirse.'
      en: 'A palindrome equals itself when reversed.'

  - id: py.u08.l02.e12
    type: write_code
    difficulty: 4
    skills: [py.slicing, py.input]
    prompt:
      es: |
        Lee una palabra de **al menos 2 letras** y muestra la palabra con su primera y su última letra intercambiadas.
        Ejemplo: `hola` → `aolh`.
      en: |
        Read a word of **at least 2 letters** and show the word with its first and its last letter swapped.
        Example: `hola` → `aolh`.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      palabra = input()
      print(palabra[-1] + palabra[1:-1] + palabra[0])
    tests:
      - {stdin: "hola\n", expected_stdout: "aolh\n", visible: true}
      - {stdin: "ab\n", expected_stdout: "ba\n", visible: false}
      - {stdin: "python\n", expected_stdout: "nythop\n", visible: false}
    wrong_examples:
      - code: |
          palabra = input()
          print(palabra[-1] + palabra[1:] + palabra[0])
        expect_fail_tag: slice.wrong_bounds
    hints:
      - {es: 'El centro de la palabra es `palabra[1:-1]`.', en: 'The middle of the word is `palabra[1:-1]`.'}
    explanation:
      es: 'Con `palabra[1:]` la última letra aparecería dos veces.'
      en: 'With `palabra[1:]` the last letter would appear twice.'
