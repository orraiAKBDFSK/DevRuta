title:
  es: 'Rebanadas (slicing)'
  en: 'Slices'
explanation:
  es: |
    Una **rebanada** extrae un fragmento: `s[inicio:fin]`, desde `inicio` hasta `fin - 1` (el final **no** se incluye):

    ```python
    s = "Python"
    print(s[0:2])     # Py
    print(s[:3])      # Pyt   (sin inicio: desde el principio)
    print(s[2:])      # thon  (sin fin: hasta el final)
    print(s[-3:])     # hon   (los últimos 3)
    print(s[::2])     # Pto   (de 2 en 2)
    print(s[::-1])    # nohtyP (al revés)
    ```

    - Funciona igual con listas: `[1, 2, 3, 4, 5][1:4]` da `[2, 3, 4]`.
    - Una rebanada **nunca falla** por pasarse del límite: `"ab"[0:10]` da `"ab"`.
    - Siempre crea un texto o lista **nuevo**.
  en: |
    A **slice** extracts a fragment: `s[start:end]`, from `start` up to `end - 1` (the end is **not** included):

    ```python
    s = "Python"
    print(s[0:2])     # Py
    print(s[:3])      # Pyt   (no start: from the beginning)
    print(s[2:])      # thon  (no end: until the end)
    print(s[-3:])     # hon   (the last 3)
    print(s[::2])     # Pto   (every 2nd)
    print(s[::-1])    # nohtyP (backwards)
    ```

    - It works the same with lists: `[1, 2, 3, 4, 5][1:4]` gives `[2, 3, 4]`.
    - A slice **never fails** for going past the limit: `"ab"[0:10]` gives `"ab"`.
    - It always creates a **new** text or list.
