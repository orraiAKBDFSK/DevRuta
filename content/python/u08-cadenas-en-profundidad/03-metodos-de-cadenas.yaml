title:
  es: 'Métodos de cadenas'
  en: 'String methods'
explanation:
  es: |
    Los textos tienen métodos propios. Como un texto **no se puede modificar**, todos **devuelven un texto nuevo**
    y el original queda igual:

    | Método | Qué hace | Ejemplo |
    |---|---|---|
    | `upper()` / `lower()` | mayúsculas / minúsculas | `"Hola".upper()` → `HOLA` |
    | `strip()` | quita espacios al inicio y al final | `"  a ".strip()` → `a` |
    | `replace(a, b)` | cambia `a` por `b` | `"casa".replace("a", "o")` → `coso` |
    | `find(x)` | posición de `x`, o `-1` si no está | `"hola".find("l")` → `2` |
    | `count(x)` | cuántas veces aparece `x` | `"banana".count("an")` → `2` |
    | `startswith(x)` / `endswith(x)` | ¿empieza / termina con `x`? | `"hola".endswith("la")` → `True` |
    | `split()` | parte el texto en una **lista** de palabras | `"a b".split()` → `['a', 'b']` |
    | `separador.join(lista)` | une una lista de textos | `"-".join(["a", "b"])` → `a-b` |

    `split()` sin argumentos separa por cualquier cantidad de espacios; `split(",")` separa por comas.
  en: |
    Text has its own methods. Since text **cannot be modified**, they all **return a new text**
    and the original stays the same:

    | Method | What it does | Example |
    |---|---|---|
    | `upper()` / `lower()` | uppercase / lowercase | `"Hola".upper()` → `HOLA` |
    | `strip()` | removes spaces at the start and end | `"  a ".strip()` → `a` |
    | `replace(a, b)` | changes `a` into `b` | `"casa".replace("a", "o")` → `coso` |
    | `find(x)` | position of `x`, or `-1` if absent | `"hola".find("l")` → `2` |
    | `count(x)` | how many times `x` appears | `"banana".count("an")` → `2` |
    | `startswith(x)` / `endswith(x)` | does it start / end with `x`? | `"hola".endswith("la")` → `True` |
    | `split()` | splits the text into a **list** of words | `"a b".split()` → `['a', 'b']` |
    | `separator.join(list)` | joins a list of texts | `"-".join(["a", "b"])` → `a-b` |

    `split()` with no arguments splits on any amount of spaces; `split(",")` splits on commas.
exercises:
  - id: py.u08.l03.e01
    type: predict_output
    difficulty: 1
    skills: [py.strings.methods]
    prompt:
      es: '¿Qué muestra este programa?'
      en: 'What does this program show?'
    code: |
      print("hola".upper())
    answer: "HOLA"
    hints:
      - {es: '`upper` pasa todo a mayúsculas.', en: '`upper` turns everything into capitals.'}
    explanation:
      es: 'Devuelve un texto nuevo en mayúsculas.'
      en: 'It returns a new text in capitals.'

