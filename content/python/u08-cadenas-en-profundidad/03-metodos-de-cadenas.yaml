  - id: py.u08.l03.e09
    type: write_code
    difficulty: 3
    skills: [py.strings.methods, py.input]
    prompt:
      es: 'Lee una frase y muestra cuántas palabras tiene (puede haber varios espacios seguidos).'
      en: 'Read a sentence and show how many words it has (there may be several spaces in a row).'
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      frase = input()
      print(len(frase.split()))
    tests:
      - {stdin: "hola mundo cruel\n", expected_stdout: "3\n", visible: true}
      - {stdin: "uno\n", expected_stdout: "1\n", visible: false}
      - {stdin: "  a   b  \n", expected_stdout: "2\n", visible: false}
    wrong_examples:
      - code: |
          frase = input()
          print(frase.count(" ") + 1)
        expect_fail_tag: logic.wrong_operation
    hints:
      - {es: '`split()` ya ignora los espacios repetidos.', en: '`split()` already ignores repeated spaces.'}
    explanation:
      es: 'Contar espacios fallaría con espacios extra al inicio, al final o repetidos.'
      en: 'Counting spaces would fail with extra spaces at the start, at the end or repeated.'

  - id: py.u08.l03.e10
    type: write_code
    difficulty: 3
    skills: [py.strings.methods, py.for, py.input]
    prompt:
      es: |
        Lee una línea con números enteros separados por espacios (por ejemplo `5 -2 7`) y muestra su suma.
      en: |
        Read a line with whole numbers separated by spaces (for example `5 -2 7`) and show their sum.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      partes = input().split()
      total = 0
      for p in partes:
          total = total + int(p)
      print(total)
    tests:
      - {stdin: "1 2 3\n", expected_stdout: "6\n", visible: true}
      - {stdin: "10\n", expected_stdout: "10\n", visible: false}
      - {stdin: "5 -2 7\n", expected_stdout: "10\n", visible: false}
    wrong_examples:
      - code: |
          partes = input().split()
          total = ""
          for p in partes:
              total = total + p
          print(total)
        expect_fail_tag: io.input_not_cast
    hints:
      - {es: '`split()` da textos; conviértelos con `int()` antes de sumar.', en: '`split()` gives texts; convert them with `int()` before adding.'}
    explanation:
      es: 'Sin `int()`, sumar textos los uniría en lugar de sumarlos.'
      en: 'Without `int()`, adding texts would join them instead of summing them.'

  - id: py.u08.l03.e11
    type: write_code
    difficulty: 3
    skills: [py.strings.methods, py.input]
    prompt:
      es: 'Lee un texto, quítale los espacios de los extremos y muestra el resultado en minúsculas.'
      en: 'Read a text, remove the spaces at its ends and show the result in lowercase.'
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      texto = input()
      print(texto.strip().lower())
    tests:
      - {stdin: "  HoLa  \n", expected_stdout: "hola\n", visible: true}
      - {stdin: "ABC\n", expected_stdout: "abc\n", visible: false}
      - {stdin: " Hola Mundo \n", expected_stdout: "hola mundo\n", visible: false}
    wrong_examples:
      - code: |
          texto = input()
          print(texto.strip())
        expect_fail_tag: logic.missing_step
      - code: |
          texto = input()
          print(texto.lower())
        expect_fail_tag: logic.missing_step
    hints:
      - {es: 'Puedes encadenar métodos: `texto.strip().lower()`.', en: 'You can chain methods: `texto.strip().lower()`.'}
    explanation:
      es: 'Cada método trabaja sobre el texto que devolvió el anterior.'
      en: 'Each method works on the text returned by the previous one.'

  - id: py.u08.l03.e12
    type: write_code
    difficulty: 4
    skills: [py.strings.methods, py.input]
    prompt:
      es: |
        Lee una frase y luego una palabra (líneas distintas). Muestra cuántas veces aparece esa palabra en la frase,
        sin distinguir mayúsculas de minúsculas.
      en: |
        Read a sentence and then a word (on separate lines). Show how many times that word appears in the sentence,
        ignoring the difference between uppercase and lowercase.
    starter: |
      # Escribe tu código aquí / Write your code here
    reference_solution: |
      frase = input()
      palabra = input()
      palabras = frase.lower().split()
      print(palabras.count(palabra.lower()))
    tests:
      - {stdin: "Hola hola HOLA mundo\nhola\n", expected_stdout: "3\n", visible: true}
      - {stdin: "a b c\nz\n", expected_stdout: "0\n", visible: false}
      - {stdin: "sol y Sol\nSOL\n", expected_stdout: "2\n", visible: false}
    wrong_examples:
      - code: |
          frase = input()
          palabra = input()
          print(frase.split().count(palabra))
        expect_fail_tag: logic.case_sensitive
    hints:
      - {es: 'Pasa ambos textos a minúsculas antes de comparar.', en: 'Turn both texts to lowercase before comparing.'}
      - {es: 'Una lista también tiene `count`.', en: 'A list also has `count`.'}
    explanation:
      es: 'Contar sobre la lista de palabras evita contar fragmentos dentro de otras palabras.'
      en: 'Counting over the list of words avoids counting fragments inside other words.'
