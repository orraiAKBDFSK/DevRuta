  - id: py.u08.l03.e07
    type: multiple_choice
    difficulty: 2
    skills: [py.strings.methods]
    prompt:
      es: |
        ¿Qué muestra este programa?

        ```python
        s = "hola"
        s.upper()
        print(s)
        ```
      en: |
        What does this program show?

        ```python
        s = "hola"
        s.upper()
        print(s)
        ```
    options:
      - {es: '`hola`, porque `upper()` devuelve un texto nuevo y no se guardó.', en: '`hola`, because `upper()` returns a new text and it was not stored.'}
      - {es: '`HOLA`', en: '`HOLA`'}
      - {es: '`None`', en: '`None`'}
      - {es: 'Un error.', en: 'An error.'}
    answer: 0
    distractor_tags: {1: string.method_returns_new}
    hints:
      - {es: 'Los textos no se pueden modificar.', en: 'Text cannot be modified.'}
    explanation:
      es: 'Para conservar el resultado hay que asignarlo: `s = s.upper()`.'
      en: 'To keep the result you must assign it: `s = s.upper()`.'

  - id: py.u08.l03.e08
    type: fill_code
    difficulty: 2
