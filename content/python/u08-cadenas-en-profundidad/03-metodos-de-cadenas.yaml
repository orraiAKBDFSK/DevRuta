    type: predict_output
    difficulty: 1
    skills: [py.strings.methods]
    prompt:
      es: '¿Qué muestra este programa?'
      en: 'What does this program show?'
    code: |
      print("  hola  ".strip())
    answer: "hola"
    hints:
      - {es: '`strip` quita los espacios de los extremos.', en: '`strip` removes the spaces at the ends.'}
    explanation:
      es: 'No quita los espacios del medio, solo los de los extremos.'
      en: 'It does not remove spaces in the middle, only at the ends.'

