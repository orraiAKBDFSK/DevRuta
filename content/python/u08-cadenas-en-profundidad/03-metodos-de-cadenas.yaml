      es: 'Completa el método para que el programa muestre `[''hola'', ''mundo'']`.'
      en: 'Fill in the method so the program shows `[''hola'', ''mundo'']`.'
    code: |
      print("hola mundo".___())
    blanks:
      - [split]
    hints:
      - {es: 'Parte el texto en palabras.', en: 'It splits the text into words.'}
